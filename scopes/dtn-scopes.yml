  description: "# Using DAIS for M2M/API Auth\nYou have been given a Client ID and a Client\
    \ Secret, which are used to request a DTN Access Token. DTN Access Tokens are required when\
    \ making calls to each and every DTN API endpoint. The following information provides additional\
    \ details on these tokens and how they are generated.\n## What is an Access Token and how\
    \ is it different from an API Key?\nAn API Key is a random string of characters that an\
    \ API uses to authorize whether or not a calling client has approved access to an endpoint.\
    \ These keys are a non-standard approach to API authorization and are generally issued on\
    \ a per-API basis.\n\nAn Access Token is also a string of characters but is a base-64 encoded\
    \ JavaScript Object Notation Web Token, or JWT. JWTs are a widely accepted standard that\
    \ use OAuth concepts and approaches. \n\nBoth API Keys and Access Tokens are used in an\
    \ Authorization Request Header as a Bearer, meaning there is no difference in where you\
    \ put this string of characters when you make calls to DTN APIs.\n## How to generate an\
    \ Access Token?\nWhen requested, an Access Token is generated for your specific Client (ID/Secret)\
    \ and for a specific API. The DTN Auth and Identity Service (DAIS) generates new Access\
    \ Tokens for your client. The DAIS endpoint is `POST https://api.auth.dtn.com/v1/tokens/authorize`.\n\
    \nThis endpoint takes two Header parameters:\n  * `Content-Type: application/json`\n  *\
    \ `Accept: application/json`\n\nThis endpoint takes four parameters in the Request Body:\n\
    \  * `grant_type`: this should always be client_credentials for generating machine-to-machine\
    \ tokens.\n  * `client_id`: this is the Client ID or Application ID using the token and\
    \ is given to you by DTN's Identity Team. This ID will never change for your client/application.\n\
    \  * `client_secret`: this is the Client Secret that is associated with the Application\
    \ ID and is given to you by DTN's Identity Team. This key is subject to rotation for security\
    \ purposes but always with the client's knowledge.\n  * `audience`: this is the API for\
    \ which this Access Token will be used. For the DTN Agency Bulletin API, you need to use\
    \ the following audience: https://weather.api.dtn.com\n\nYou can use this CURL command template\
