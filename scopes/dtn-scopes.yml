    ,\n\"client_id\": \"insert your client id here\",\n\"client_secret\": \"insert your client\
    \ secret here\",\n\"audience\": \"insert your audience here\"\n}' \n  ```\n\n*This document,\
    \ for demonstration purposes, supplies a client_id and client_secret in all code examples.\
    \ This client/application is for a fictitious API and cannot be used in practice to gain\
    \ unauthorized access to any other DTN API.*\nUpon generating a new Access Token, you should\
    \ receive an HTTP Response from DAIS similar to this:\n  ```\n  {\n    \"data\": {\n   \
