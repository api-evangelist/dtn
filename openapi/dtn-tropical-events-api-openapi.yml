schemes:
- https
tags:
- name: Tropical Events
  description: Tropical Events
paths:
  /feeds/v3/tropical:
    get:
      tags:
      - Tropical Events
      summary: 'List all current tropical events '
      description: 'List all current tropical events '
      produces:
      - application/json
      parameters: []
