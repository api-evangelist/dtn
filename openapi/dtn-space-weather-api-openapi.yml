                  category:
                    Power systems: Possible widespread voltage control problems and some protective systems will mistakenly trip out key assets from the grid.
                    Spacecraft operations: May experience surface charging and tracking problems, corrections may be needed for orientation problems.
                    Other systems: Induced pipeline currents affect preventive measures, HF radio propagation sporadic, satellite navigation degraded for hours, low-frequency radio navigation disrupted, and aurora has been seen as low as Alabama and northern California (typically 45&deg; geomagnetic lat.).
                  descriptor: Severe
                  hex: '#ff0000'
                  colorName: Red
                  physicalMeasure: Kp = 8, including a 9-
                  averageFrequency: 100 per cycle (60 days per cycle)
                  r: 255
                  g: 0
                  b: 0
