        swpcNoaaScalesExplanation:
          eventCode:
            G:
              eventName: Geomagnetic Storms
              scale:
                '0':
                  category:
                    All: No G-Scale Geomagnetic Storming
                  descriptor: None
                  hex: '#92d14f'
                  colorName: Atlantis
                  physicalMeasure: null
                  averageFrequency: null
                  r: 146
                  g: 209
                  b: 79
                '1':
                  category:
                    Power systems: Weak power grid fluctuations can occur.
                    Spacecraft operations: Minor impact on satellite operations possible.
                    Other systems: Migratory animals are affected at this and higher levels; aurora is commonly visible at high latitudes (northern Michigan and Maine).
                  descriptor: Minor
                  hex: '#f5ea14'
                  colorName: Lemon
                  physicalMeasure: Kp = 5
                  averageFrequency: 1700 per cycle (900 days per cycle)
                  r: 245
                  g: 234
                  b: 20
                '2':
                  category:
                    Power systems: High-latitude power systems may experience voltage alarms, long-duration storms may cause transformer damage.
                    Spacecraft operations: Corrective actions to orientation may be required by ground control; possible changes in drag affect orbit predictions.
                    Other systems: HF radio propagation can fade at higher latitudes, and aurora has been seen as low as New York and Idaho (typically 55&deg; geomagnetic lat.).
                  descriptor: Moderate
                  hex: '#ffc800'
                  colorName: Tangerine Yellow
                  physicalMeasure: Kp = 6
                  averageFrequency: 600 per cycle (360 days per cycle)
                  r: 255
                  g: 200
                  b: 0
                '3':
                  category:
                    Power systems: Voltage corrections may be required, false alarms triggered on some protection devices.
                    Spacecraft operations: Surface charging may occur on satellite components, drag may increase on low-Earth-orbit satellites, and corrections may be needed for orientation problems.
                    Other systems: Intermittent satellite navigation and low-frequency radio navigation problems may occur, HF radio may be intermittent, and aurora has been seen as low as Illinois and Oregon (typically 50&deg; geomagnetic lat.).
                  descriptor: Strong
                  hex: '#ff9500'
                  colorName: Dark Orange
                  physicalMeasure: Kp = 7
                  averageFrequency: 200 per cycle (130 days per cycle)
                  r: 255
                  g: 149
                  b: 0
