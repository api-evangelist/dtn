                    Power systems: Widespread voltage control problems and protective system problems can occur, some grid systems may experience complete collapse or blackouts. Transformers may experience damage.
                    Spacecraft operations: May experience extensive surface charging, problems with orientation, uplink/downlink and tracking satellites.
                    Other systems: Pipeline currents can reach hundreds of amps, HF (high frequency) radio propagation may be impossible in many areas for one to two days, satellite navigation may be degraded for days, low-frequency radio navigation can be out for hours, and aurora has been seen as low as Florida and southern Texas (typically 40&deg; geomagnetic lat.).
                  descriptor: Extreme
