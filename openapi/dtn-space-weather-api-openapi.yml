openapi: 3.2.0
info:
  title: DTN Aviation Enhanced Flight Hazards (EFH) Space Weather API
  description: The DTN Aviation Enhanced Flight Hazards (EFH) API retrieves available turbulence (including Nowcast), icing, high ice water content (HIWC), thunderstorms, ozone, jet stream axis, space weather, and Quantitative Volcanic Ash (QVA) data.  Each data type has its own endpoint.  Filtering parameters allow to limit data requests in various ways, particularly in limiting the area for which to find data.
  version: 1.10.3
servers:
- url: https://aviation.api.dtn.com
security:
- clientCredentials: []
tags:
- name: Space Weather
  description: Space Weather Prediction Center (SWPC) NOAA Scales data via API
paths:
  /v1/swpc-noaa-scales/data:
    get:
      tags:
      - Space Weather
      summary: Get parsed SWPC data
      description: Get recent SWPC NOAA Scales data, potentially filtered by various query parameters
      responses:
        '200':
          $ref: '#/components/responses/SwpcNoaaScalesDataSuccess'
        '400':
          $ref: '#/components/responses/SwpcNoaaScalesDataBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
      parameters:
      - $ref: '#/components/parameters/QueryOffset'
      - $ref: '#/components/parameters/QueryLimit'
      - $ref: '#/components/parameters/QuerySwpcNoaaScalesEventCodes'
      - $ref: '#/components/parameters/QuerySwpcNoaaScalesPeriodLabels'
      - $ref: '#/components/parameters/SwpcNoaaScalesQueryInsertedAfter'
      - $ref: '#/components/parameters/SwpcNoaaScalesQueryInsertedThrough'
      security:
      - clientCredentials: []
  /v1/swpc-noaa-scales/raw:
    get:
      tags:
      - Space Weather
      summary: Get raw SWPC data
      description: Get recent SWPC NOAA Scales data in raw format, potentially filtered by various query parameters
      responses:
        '200':
          $ref: '#/components/responses/SwpcNoaaScalesRawSuccess'
        '400':
          $ref: '#/components/responses/SwpcNoaaScalesRawBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
      parameters:
      - $ref: '#/components/parameters/QueryOffset'
      - $ref: '#/components/parameters/QueryLimit'
      - $ref: '#/components/parameters/SwpcNoaaScalesQueryInsertedAfter'
      - $ref: '#/components/parameters/SwpcNoaaScalesQueryInsertedThrough'
      security:
      - clientCredentials: []
  /v1/swpc-noaa-scales/explanation:
    get:
      tags:
      - Space Weather
      summary: Get SWPC reference information
      description: Get SWPC NOAA Scales reference information for interpreting data values
      responses:
        '200':
          $ref: '#/components/responses/SwpcNoaaScalesExplanationSuccess'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
      parameters: []
      security:
      - clientCredentials: []
components:
  schemas:
    Meta:
      title: Meta
      description: Meta data attached to every response
      required:
      - name
      - request_id
      - start_timestamp
      - end_timestamp
      - execution_time
      type: object
      properties:
        name:
          type: string
        request_id:
          type: string
        start_timestamp:
          type: integer
        end_timestamp:
          type: integer
        execution_time:
          type: integer
    SwpcNoaaScalesExplanationItem:
      type: object
      properties:
        eventName:
          type: string
        scale:
          type: object
          additionalProperties:
            type: object
            properties:
              category:
                type: object
                additionalProperties:
                  type: string
              descriptor:
                type: string
              hex:
                type: string
              colorName:
                type: string
              physicalMeasure:
                type:
                - string
                - 'null'
              averageFrequency:
                type:
                - string
                - 'null'
              r:
                type: integer
              g:
                type: integer
              b:
