            instance: urn:dtn:aviation-api:/v1/health-check:requestId:cc3c6cf1-6fd4-43c8-8ec7-bf60eac34d87
            meta:
              name: v1.health-check
              uuid: f0d77c62-cccb-468e-9e80-0ed1d6f921c4
              request_id: cc3c6cf1-6fd4-43c8-8ec7-bf60eac34d87
              start_timestamp: 1714684480017
