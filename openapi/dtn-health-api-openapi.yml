      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            Error:
              value:
                status: error
                code: invalid-token
                description: bad token
      description: info about error
    HealthCheckReport:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthCheck'
          examples:
            Success:
              value:
                status: up
                version: v2
                info: Service is healthy.
                timestamp: 2018-02-10T09:30Z
                env: unknown
      description: Health Check report
    InternalServerErrorResponse:
      description: Internal Server Error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error_2'
    HealthCheckReport_2:
      description: Health Check report
      content:
