openapi: 3.2.0
info:
  title: Dtn Health API
  version: '1.0'
  description: 'Operations tagged Health across 6 of this provider''s published API definitions: dtn-developer-portal-api-openapi.json, dtn-digital-commerce-orders-openapi.json, dtn-energy-digital-commerce-integrations-api-openapi.json, dtn-lightning-api-openapi.json, dtn-pavement-conditions-api-openapi.json, dtn-websocket-api-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: http://localhost:3000
- url: ' https://ext-svc-orders-2a698b99-digitalcommerce-uat.onlinefuelslabs.io'
- url: https://digitalcommerce-integrations.dtn.com
  description: Production API URL
- url: https://lightning.api.dtn.com
- url: https://pavement-condition.prd.wx.zones.dtn.com/v2
  description: Production server
- url: https://pavement-condition.stg.wx.zones.dtn.com/v2
  description: Staging server
- url: https://aviation.api.dtn.com
tags:
- name: Health
  description: Utility endpoints used by K8s
paths:
  /health-check:
    summary: Health Check
    description: The health check endpoint provides information about the health of a web service. If each of the components required by the service are healthy, then the service is considered healthy and will return a 200 OK response. If any of the components needed by the service are unhealthy, then a 503 Service Unavailable response will be provided.
    get:
      tags:
      - Health
      summary: Health Check
      responses:
        '200':
          $ref: '#/components/responses/HealthCheckReport'
        '503':
          $ref: '#/components/responses/ErrorResponse'
      operationId: healthCheck
      description: ''
      security:
      - clientCredentials: []
    servers:
    - url: http://localhost:3000
  /liveness:
    summary: Kubernetes will use this endpoint to monitor service's health.
    description: 'Kubernetes will use this endpoint to monitor service''s health. In case it fails for a while, K8s will automatically try to restart the Pod. This endpoint should only monitor the main service process and should not return an error for temporary shortages. Dependencies will be monitored using `readiness` endpoint. For more information: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/#define-a-liveness-http-request'
    get:
      tags:
      - Health
      summary: Kubernetes will use this endpoint to monitor service's health.
      responses:
        '200':
          $ref: '#/components/responses/HealthCheckReport'
        '503':
          $ref: '#/components/responses/ErrorResponse'
      operationId: liveness
      security:
      - clientCredentials: []
    servers:
    - url: http://localhost:3000
  /readiness:
    summary: Kubernetes will use this endpoint to monitor service's readiness.
    description: 'Kubernetes will use this endpoint to monitor if the service is responsive. In case it fails, K8s will stop routing the traffic until the service is responsive again. This endpoint should monitor all the underlying dependencies (databases, other API calls etc.) For more information: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/#define-readiness-probes'
    get:
      tags:
      - Health
      summary: Kubernetes will use this endpoint to monitor service's readiness.
      responses:
        '200':
          $ref: '#/components/responses/HealthCheckReport'
        '503':
          $ref: '#/components/responses/ErrorResponse'
      operationId: readiness
      security:
      - clientCredentials: []
    servers:
    - url: http://localhost:3000
  /health:
    x-swagger-router-controller: health
    get:
      description: Returns Health Status to the caller
      operationId: health
      responses:
        '200':
          description: Success
          schema:
            required:
            - version
            - status
            properties:
              version:
                type: string
              status:
                type: string
        default:
          description: Error
          schema:
            required:
            - message
            properties:
              message:
                type: string
      tags:
      - Health
    summary: Health Check
    description: The health check endpoint provides information about the health of a web service. If each of the components required by the service are healthy, then the service is considered healthy and will return a 200 OK response. If any of the components needed by the service are unhealthy, then a 503 Service Unavailable response will be provided.
    servers:
    - url: ' https://ext-svc-orders-2a698b99-digitalcommerce-uat.onlinefuelslabs.io'
  /v1/health-check:
    summary: Health Check
    description: 'The health check endpoint provides information about the health of a web service.

      If each of the components required by the service are healthy, then the service is considered healthy and will return a 200 OK response.

      If any of the components needed by the service are unhealthy, then a 503 Service Unavailable response will be provided.'
    get:
      summary: Get Health Check Report
      tags:
      - Health
      responses:
        '200':
          $ref: '#/components/responses/HealthCheckReport'
        '503':
          $ref: '#/components/responses/ErrorResponse'
      description: ''
    servers:
    - url: https://lightning.api.dtn.com
  /v1/health-check/:
    get:
      tags:
      - Health
      summary: Health Check
      description: The health check endpoint provides information about the health of a web service. If each of the components required by the service are healthy, then the service is considered healthy and will return a 200 OK response. If any of the components needed by the service are unhealthy, then a 503 Service Unavailable response will be provided.
      responses:
        '200':
          $ref: '#/components/responses/HealthCheckReport_3'
        '503':
          $ref: '#/components/responses/HealthInternalError'
      security:
      - clientCredentials: []
    servers:
    - url: https://aviation.api.dtn.com
