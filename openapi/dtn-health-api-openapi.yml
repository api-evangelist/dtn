          enum:
          - error
          type: string
        code:
          enum:
          - invalid-id
          - internal-error
          - invalid-token
          - missing-scope
          type: string
        description:
          type: string
      example:
        status: error
        code: invalid-token
        description: The token has expired.
    HealthCheck:
      title: HealthCheckResponse
      description: Health Check Response
      required:
      - status
      type: object
      properties:
        status:
          type: string
        version:
          type: string
        info:
          type: string
        timestamp:
          format: date-time
          type: string
        env:
          type: string
      example:
        status: up
        version: unknown
        info: Service is healthy
        timestamp: '2021-04-19T22:10:53Z'
        env: unknown
    HealthCheck_2:
