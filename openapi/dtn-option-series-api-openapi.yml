openapi: 3.2.0
info:
  title: PXWeb Market Data Option Series API
  description: "ProphetX Web services, in short __PXWeb__, provides the facility to access real time quotes and historical market information \nfrom a JSON and REST based web service.\n\nPXWeb end points are divided into four categories: Quotes, History, Information, and Option Series.  Requests in the quotes category\nare for getting the most recent prices on a symbol.  History is for requesting prices from specific time periods in the past and supports \ndaily, minute, and tick history.  Information contains a request for searching for symbols based on text strings and a request for \nquerying the market hours of a symbol.  The option series category contains on request for getting quotes on many futures options\nbased on an option root and an expiration."
  version: 1.0.2
servers:
- description: Production (PROD)
  url: https://pxweb.dtn.com
- description: Customer Acceptance Testing (CAT)
  url: https://pxwebcat.dtn.com
- description: QA Testing (PRE)
  url: https://prx-ws-pre.dtn.com
- description: Development (DEV)
  url: https://prx-app1-dev.dtn.com
tags:
- name: Option Series
paths:
  /market_data/options/series:
    get:
      tags:
      - Option Series
      summary: Get a list of futures option prices
      description: "Retrieve a list of options available for an option prefix (option root and maturity).  The operation will also query data for the underlying of the specified option root. The option data will also include the StrikeLevel fid which indicates if the option is currently at the money, in the money, or out of the money. At the money means the strike is the closest one to the current underlying price. In the money means either a Call with a strike below the underlying price or a Put with a strike above the underlying. Out of the money means either a Call with a strike above the underlying price or a Put with a strike below the underlying price. By default all options matching the prefix will be returned. The limit parameter can be used to get fewer results. If limit is specified the operation returns the specified limit number of options above and below the at the money strike price.\n\n\n**Note: The Dev Portal 'Try' feature does not currently work for the Market Data API.  To try the API, please see this site: https://pxweb.dtn.com/PXWebDoc/OAS/index.html or use the attached Postman collection.  Contact DTN here: https://www.dtn.com/contact-us/ for a trial account.**  \n"
      operationId: getOptionSeries
      parameters:
      - $ref: '#/components/parameters/optionPrefixParam'
      - $ref: '#/components/parameters/fieldsParam'
      - $ref: '#/components/parameters/fieldGroupParam'
      - $ref: '#/components/parameters/strikeLimitParam'
      responses:
        '200':
          description: The request was successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    $ref: '#/components/schemas/Meta'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OptionSeries'
        5XX:
          description: An internal server error has occurred.  Sending the error response to support will help with troubleshooting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    MarketDepth:
      description: If available for the symbol, market depth is returned as two arrays.  One for bids, and the other for asks.  Bids are sorted from highest price to lowest, and asks are sroted lowest price to highest.
      properties:
        askLevels:
          items:
            $ref: '#/components/schemas/MarketDepthQuote'
          type: array
        bidLevels:
          items:
            $ref: '#/components/schemas/MarketDepthQuote'
          type: array
      type: object
    Meta:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        count:
          type: number
          description: Number of symbols returned by request
        dataSrc:
          type: string
          description: A value used by DTN support for troublshooting any issues
        duration:
          type: string
          description: The duration of time DTN servers spent processing the request.  Does not include internet transit time.
        userId:
          type: string
          description: The user that made the request.
        operation:
          type: string
          description: The name of the operation called
        pageToken:
          type: string
          description: A page token returned from a previous request. It is used to resume a request that matched more symbols than the Limit allowed in one request.
    Greeks:
      type: object
      description: An object to hold futures options price sensitivity values known as greeks.  Only returned by /quotes/greeks
      properties:
