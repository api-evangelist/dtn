          description: Price sensitivity of an option to the price of the underlying.
          format: double
          type: number
        gamma:
          description: Price sensitivity of an option to changes in the price of the underlying.
          format: double
          type: number
        theta:
          description: Price sensitivity of an option to the time to expiration.
          format: double
          type: number
        vega:
          description: Price sensitivity of an option to changes in volatility.
          format: double
          type: number
        underlyingPrice:
          description: Price of an option's underlying.
          $ref: '#/components/schemas/Price'
        interestRate:
          description: Interest rate used in option calculations.
          format: double
          type: number
        impliedVolatility:
          description: Implied volatility used in option calculations.
          format: double
          type: number
    MarketDepthQuote:
      properties:
        size:
