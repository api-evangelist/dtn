openapi: 3.2.0
info:
  title: Energy Event Index Customer Get Eei Forecast API
  description: '# Energy Event Index (EEI) Customer API


    This API provides access to Energy Event Index (EEI) data for individual existing EEI customers. The Energy Event Index is a way to describe the impact of weather on energy/utility infrastructure, as well as wildfire risks.


    ## About Energy Event Index (EEI)

    The EEI applies a risk level (the index) to not only a range of weather parameters, but the likelihood in which they will occur, as well as the confidence/likelihood of change. A customer''s EEI scale is applied to their specific requirements and their service areas.


    ### EEI Parameters

    The EEI system evaluates multiple weather parameters that can impact energy infrastructure:

    - **Wind Speed & Wind Gust**: Both synoptically-driven and storm-driven winds

    - **Snow**: Accumulation amounts that can affect power lines and equipment

    - **Ice**: Ice accumulation on infrastructure

    - **Lightning**: Electrical storm activity

    - **Flooding**: Water-related impacts to facilities

    - **Wildfire**: Fire risk assessment

    - **Rainfall**: Precipitation impacts (measured in 4-hour periods)


    ### Seasonal Considerations

    Most customers have two sets of criteria:

    - **"Leaves On" Season**: Typically spring through fall when foliage can impact power grids

    - **"Leaves Off" Season**: Winter months when trees are bare


    These seasonal thresholds account for how regional foliage impacts the power grid at different times of the year.


    ## Purpose

    The primary purpose of this API is to:

    1. Retrieve EEI data from the Weather Sentry Online (WSO)

    2. Process and format this data according to customer-specific configurations

    3. Serve the processed EEI information to existing customers through a customer-facing interface

    4. Provide threshold data that reflects seasonal "leaves on/off" criteria


    ## Key Features

    - Secure authentication for existing EEI customers

    - Retrieval of up-to-date EEI forecast data

    - Customer-specific threshold configurations

    - Seasonal threshold adjustments (leaves on/off periods)

    - Regional forecast data for customer service territories


    ## Target Audience

    This API is designed for use by:

    - Energy and utility companies with EEI subscriptions

    - Emergency management systems requiring weather impact forecasts

    - Internal systems that require EEI data for customer-facing applications

    - Decision-making tools for utility operations and crew deployment


    ## Data Flow

    1. The API retrieves raw EEI data from the Weather Sentry Online (WSO)

    2. Data is processed according to customer-specific configurations and seasonal criteria

    3. Customers can access their relevant EEI information through authenticated API calls

    4. Forecast data includes confidence levels and multi-day outlooks


    ## Security

    This API implements robust security measures to ensure that only authenticated and authorized customers can access their EEI data.


    For detailed information on endpoints, request/response formats, and authentication, please refer to the API documentation below.'
  version: 1.1.0
servers:
- url: https://eei.dtn.com
security:
- clientCredentials: []
tags:
- name: Get Eei Forecast
paths:
  /v1/get-eei-forecast:
    get:
      operationId: getEEIData1
      summary: Retrieve EEI forecast data for client's regions
      description: Fetches detailed EEI (Energy Event Index) forecast data for various regions, including confidence levels and weather parameters.
      responses:
        '200':
          description: 'Successful retrieval of all EEI forecast parameters.

            For array values such as confidenceLevel, windGust, windSpeed etc.: ({ confidenceLevel: [1,2,3]})

            The array [1, 3, 5] corresponds to three consecutive days starting from the date in updated_at_utc.

            For example, if updated_at_utc converts to December 1, 2024 in the local timezone:

            - The first value (1) represents December 1

            - The second value (3) represents December 2

            - The third value (5) represents December 3

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  forecaster:
                    type: string
                  updated_at_utc:
                    type: integer
                  discussion:
                    type: string
                  regions:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        confidenceLevel:
                          type: array
                          items:
                            type: integer
                        flooding:
                          type: array
                          items:
                            type: integer
                        ice:
                          type: array
                          items:
                            type: integer
                        lightning:
                          type: array
                          items:
                            type: integer
                        rainfall:
                          type: array
                          items:
                            type: integer
                        snow:
                          type: array
                          items:
                            type: integer
                        wildfire:
                          type: array
                          items:
                            type: integer
                        windGust:
                          type: array
                          items:
                            type: integer
                        windSpeed:
                          type: array
                          items:
                            type: integer
        '401':
          description: "Unauthorized - Invalid or missing authentication token, or account not properly configured\nIf you receive a message stating \"Account not configured with a valid OM Customer ID\", \nplease contact your administrator to ensure your account is properly set up.\n"
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
              examples:
                invalidToken:
                  summary: Invalid or missing token
                  value:
                    type: unauthorized
                    title: Error while authenticating the user
                    status: 401
                    detail: Unauthorized. Please make sure you provided the correct headers
                    instance: urn:dtn:wx-eei-api:/v1/get-eei-forecast:requestId:3dfcd9b8-04f3-4f8a-8d57-3ab61803dd83
                invalidAccount:
                  summary: Invalid account configuration
                  value:
                    type: forbidden
                    title: Access to the Requested Resource is Forbidden
                    status: 401
                    detail: Account not configured with a valid OM Customer ID.
                    instance: urn:dtn:wx-eei-api:/v1/get-eei-forecast:requestId:aa50e28b-7ad4-4764-b1f1-414c55c9db43
        '500':
          description: 'Internal Server Error - An unexpected error occurred on the server.

            If you encounter this error, please contact your administrator for assistance.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
              examples:
                identityAPIError:
                  summary: Error communicating with Identity API
                  value:
                    type: internal-server-error
                    title: Internal Server Error
                    status: 500
                    detail: Failed to request data from the Identity API.
                    instance: urn:dtn:wx-eei-api:/v1/get-eei-forecast:requestId:e4547111-872e-4ab6-afa2-42015133433f
                unknownCustomerId:
                  summary: Unknown Customer ID
                  value:
                    type: internal-server-error
                    title: Internal Server Error
                    status: 500
                    detail: Unknown Customer Id.
                    instance: urn:dtn:wx-eei-api:/v1/get-eei-forecast:requestId:74265ea4-5a99-4255-84d3-891a1e3b9e60
      tags:
      - Get Eei Forecast
  /v1/get-eei-forecast/{parameter}:
    get:
      operationId: getEEIData2
      summary: Retrieve specific EEI forecast parameter data for Iberdrola USA regions
      description: "Fetches EEI (Energy Event Index) forecast data for a specific parameter across various regions. \nThis endpoint allows you to retrieve data for a single parameter, reducing the payload size when only specific information is needed.\nAvailable parameters are:\n- wind-speed\n- confidence-level\n- flooding\n- ice\n- lightning\n- rainfall\n- snow\n- wildfire\n- wind-gust\n"
      parameters:
      - in: path
        name: parameter
        required: true
        schema:
          type: string
          enum:
          - wind-speed
          - confidence-level
          - flooding
          - ice
          - lightning
          - rainfall
          - snow
          - wildfire
          - wind-gust
        description: The specific EEI forecast parameter to retrieve
      responses:
        '200':
          description: 'Successful retrieval of the specified EEI forecast parameter.

            For array values such as windSpeed, confidenceLevel, and windGust:

            The array [1, 1, 1] corresponds to three consecutive days starting from the date in updated_at_utc.

            For example, if updated_at_utc converts to December 1, 2024 in the local timezone:

            - The first value represents December 1

            - The second value represents December 2

            - The third value represents December 3

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  forecaster:
                    type: string
                  updated_at_utc:
                    type: integer
                  discussion:
                    type: string
                  regions:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        windSpeed:
                          type: array
                          items:
                            type: integer
                        confidenceLevel:
                          type: array
                          items:
                            type: integer
                        flooding:
                          type: array
                          items:
                            type: integer
                        ice:
                          type: array
                          items:
                            type: integer
                        lightning:
                          type: array
                          items:
                            type: integer
                        rainfall:
                          type: array
                          items:
                            type: integer
                        snow:
                          type: array
                          items:
                            type: integer
                        wildfire:
                          type: array
                          items:
                            type: integer
                        windGust:
                          type: array
                          items:
                            type: integer
        '401':
          description: "Unauthorized - Invalid or missing authentication token, or account not properly configured\nIf you receive a message stating \"Account not configured with a valid OM Customer ID\", \nplease contact your administrator to ensure your account is properly set up.\n"
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
              examples:
                invalidToken:
                  summary: Invalid or missing token
                  value:
                    type: unauthorized
                    title: Error while authenticating the user
                    status: 401
                    detail: Unauthorized. Please make sure you provided the correct headers
                    instance: urn:dtn:wx-eei-api:/v1/get-eei-forecast/{parameter}:requestId:3dfcd9b8-04f3-4f8a-8d57-3ab61803dd83
                invalidAccount:
                  summary: Invalid account configuration
                  value:
                    type: forbidden
                    title: Access to the Requested Resource is Forbidden
                    status: 401
                    detail: Account not configured with a valid OM Customer ID.
                    instance: urn:dtn:wx-eei-api:/v1/get-eei-forecast/{parameter}:requestId:aa50e28b-7ad4-4764-b1f1-414c55c9db43
        '500':
          description: 'Internal Server Error - An unexpected error occurred on the server.

            If you encounter this error, please contact your administrator for assistance.

            '
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
                  detail:
                    type: string
                  instance:
                    type: string
              examples:
                identityAPIError:
                  summary: Error communicating with Identity API
                  value:
                    type: internal-server-error
                    title: Internal Server Error
                    status: 500
                    detail: Failed to request data from the Identity API.
                    instance: urn:dtn:wx-eei-api:/v1/get-eei-forecast/{parameter}:requestId:e4547111-872e-4ab6-afa2-42015133433f
                unknownCustomerId:
                  summary: Unknown Customer ID
                  value:
                    type: internal-server-error
                    title: Internal Server Error
                    status: 500
                    detail: Unknown Customer Id.
                    instance: urn:dtn:wx-eei-api:/v1/get-eei-forecast/{parameter}:requestId:74265ea4-5a99-4255-84d3-891a1e3b9e60
      tags:
      - Get Eei Forecast
components:
  securitySchemes:
    clientCredentials:
      type: oauth2
      x-receive-token-in: request-body
      flows:
        clientCredentials:
          tokenUrl: https://api.auth.dtn.com/v1/tokens/authorize
      description: "# Using DAIS for M2M/API Auth\nYou have been given a Client ID and a Client Secret, which are used to request a DTN Access Token. DTN Access Tokens are required when making calls to each and every DTN API endpoint. The following information provides additional details on these tokens and how they are generated.\n## What is an Access Token and how is it different from an API Key?\nAn API Key is a random string of characters that an API uses to authorize whether or not a calling client has approved access to an endpoint. These keys are a non-standard approach to API authorization and are generally issued on a per-API basis.\n\nAn Access Token is also a string of characters but is a base-64 encoded JavaScript Object Notation Web Token, or JWT. JWTs are a widely accepted standard that use OAuth concepts and approaches. \n\nBoth API Keys and Access Tokens are used in an Authorization Request Header as a Bearer, meaning there is no difference in where you put this string of characters when you make calls to DTN APIs.\n## How to generate an Access Token?\nWhen requested, an Access Token is generated for your specific Client (ID/Secret) and for a specific API. The DTN Auth and Identity Service (DAIS) generates new Access Tokens for your client. The DAIS endpoint is `POST https://api.auth.dtn.com/v1/tokens/authorize`.\n\nThis endpoint takes two Header parameters:\n  * `Content-Type: application/json`\n  * `Accept: application/json`\n\nThis endpoint takes four parameters in the Request Body:\n  * `grant_type`: this should always be client_credentials for generating machine-to-machine tokens.\n  * `client_id`: this is the Client ID or Application ID using the token and is given to you by DTN's Identity Team. This ID will never change for your client/application.\n  * `client_secret`: this is the Client Secret that is associated with the Application ID and is given to you by DTN's Identity Team. This key is subject to rotation for security purposes but always with the client's knowledge.\n  * `audience`: this is the API for which this Access Token will be used. For the DTN Energy Event Index API, you need to use the following audience: https://eei.dtn.com\n\nYou can use this CURL command template as a reference for obtaining an access token:\n  ```\n  curl --location --request POST 'https://api.auth.dtn.com/v1/tokens/authorize' \\\n--header 'Accept: application/json' \\\n--header 'Content-Type: application/json' \\\n--data-raw '{\n\"grant_type\": \"client_credentials\",\n\"client_id\": \"insert your client id here\",\n\"client_secret\": \"insert your client secret here\",\n\"audience\": \"insert your audience here\"\n}' \n  ```\n\n*This document, for demonstration purposes, supplies a client_id and client_secret in all code examples. This client/application is for a fictitious API and cannot be used in practice to gain unauthorized access to any other DTN API.*\nUpon generating a new Access Token, you should receive an HTTP Response from DAIS similar to this:\n  ```\n  {\n    \"data\": {\n          \"access_token\": \"eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6InpfX21pZW13NGhoTmdvQWQxR3N6ciJ9..0VHdyp1w9PPFVI0FPheAwuKZwb5C25rwP-LPMXcSNoRmouvga1DZtNLA67ZzE_sAlc_VpaDRr6daLKr_Alw4347mw9sdjP8wKR27kCZa9JZK5PGQMmXHscATbzBEJYpCPklfyGaajgymqTBGnedcv8F0UvlRzQPsFeRPnVoX7BWOSXpMbyToGiXWkQLBQT7r96KAmLZOPJFZspPtjw-wH2mSL2WNa_nkB4j5vMGhGxlKiNRsKb30TH_WAel2hsxNlcPK3XHCmrMTYsNnu7HNqOTMn2i0__0rvBrhSWEw-_grqQDmWFJuWd7Qhi1q81AaJcdqgoSa_efz93QFclJUNw\",\n          \"scope\": \"read:demo create:demo update:demo\",\n          \"expires_in\": 90,\n          \"token_type\": \"Bearer\"\n      },\n      \"meta\": {\n          \"date_time\": \"2022-06-24T19:09:42.963Z\",\n          \"name\": \"v1.tokens.authorize\",\n          \"uuid\": \"ee6f9feb-dcf8-4421-a6fd-efd6beabdaa9\",\n          \"start_timestamp\": 1656097782509,\n          \"end_timestamp\": 1656097782963,\n          \"execution_time\": 454\n      }\n  }\n  ```\nLooking at this Response, you will see:\n  * `access_token`: contains the JWT Access Token string you will use as your Bearer token.\n  * `scope`: contains the scopes that this Access Token gives you permissions to access.\n  * `expires_in`: contains the length of time before this Access Token will expire, in seconds.\n  * `token_type`: verifies that this Access Token should be used as a Bearer token.\n\n## How to use an Access Token after one is generated?\nOnce a new Access Token is obtained, it is used in each call to a DTN API endpoint as a Bearer token in an Authorization Request Header. For example:\n  ```\n  Header: 'Authorization: Bearer eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6InpfX21pZW13NGhoTmdvQWQxR3N6ciJ9..0VHdyp1w9PPFVI0FPheAwuKZwb5C25rwP-LPMXcSNoRmouvga1DZtNLA67ZzE_sAlc_VpaDRr6daLKr_Alw4347mw9sdjP8wKR27kCZa9JZK5PGQMmXHscATbzBEJYpCPklfyGaajgymqTBGnedcv8F0UvlRzQPsFeRPnVoX7BWOSXpMbyToGiXWkQLBQT7r96KAmLZOPJFZspPtjw-wH2mSL2WNa_nkB4j5vMGhGxlKiNRsKb30TH_WAel2hsxNlcPK3XHCmrMTYsNnu7HNqOTMn2i0__0rvBrhSWEw-_grqQDmWFJuWd7Qhi1q81AaJcdqgoSa_efz93QFclJUNw'\n  ```\n\n## Deconstructing the Access Token\nA DTN Access Token carries information within its JWT Body that is available on every API call. By deconstructing the JWT token, our Access Tokens will resemble:\n  ```\n  {\n    \"https://auth.dtn.com/customerId\": \"1234567890Demo\",\n    \"https://auth.dtn.com/productCode\": \"DemoApiP\",\n    \"https://auth.dtn.com/requesterIp\": \"18.213.174.27\",\n    \"https://auth.dtn.com/rps\": \"100\",\n    \"https://auth.dtn.com/tier\": \"Basic\",\n    \"https://auth.dtn.com/quota\": \"999999\",\n    \"iss\": \"https://id.auth.dtn.com/\",\n    \"sub\": \"nfyO3KiKPR8N0DKR5CL8jS9GFBCDeyFM@clients\",\n    \"aud\": \"https://demo-api.auth.dtn.com/\",\n    \"iat\": 1656099068,\n    \"exp\": 1656099158,\n    \"azp\": \"nfyO3KiKPR8N0DKR5CL8jS9GFBCDeyFM\",\n    \"scope\": \"read:demo create:demo update:demo\",\n    \"gty\": \"client-credentials\",\n    \"permissions\": [\n      \"read:demo\",\n      \"create:demo\",\n      \"update:demo\"\n    ]\n  }\n  ```\n### Description of Claims\n\n  | Claim                              | Type                                        | Description                                                                                                                                                                                                                |\n  | -----------------------------------| --------------------------------------------| ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|\n  | `https://auth.dtn.com/customerId`  | String                                      | Custom DTN claim containing the Customer ID found in the DTN Order Management/Salesforce system associated with this token.                                                                                                |\n  | `https://auth.dtn.com/productCode` | String                                      | Custom DTN claim containing the Identity product code associated with this token.                                                                                                                                          |\n  | `https://auth.dtn.com/requesterIp` | String                                      | Custom DTN claim containing the IP address of the requesting client.                                                                                                                                                       |\n  | `https://auth.dtn.com/rps`         | String                                      | Custom DTN claim containing the maximum rate per second this customer is authorized to utilize.                                                                                                                            |\n  | `https://auth.dtn.com/tier`        | String                                      | Custom DTN claim containing the data tier the customer purchased for the requested access.                                                                                                                                 |\n  | `https://auth.dtn.com/quota`       | String                                      | Custom DTN claim containing the maximum yearly quota the customer purchased for calling DTN endpoints for the specific product.                                                                                            |\n  | `iss`                              | String (URI)                                | The Security Token Service (STS) that issues and returns the token. If this value is not from `https://id.auth.dtn.com/`, the token should not be considered trusted.                                                      |\n  | `sub`                              | String (URI)                                | The principle about which the token asserts information (the User ID or Client ID within the Identity Provider). A User ID will start with a prefix of `auth0\\|`, while the Client ID will end with the suffix `@clients`. |\n  | `aud`                              | String \\| Array (Strings) (URI \\| [URI, …]) | Identifies the intended recipient(s) of the token – its audience. The token should be rejected if the audience does not contain values expected by the calling application.                                                |\n  | `iat`                              | Number (Timestamp)                          | “Issued At” indicates when the authentication for this token occurred.                                                                                                                                                     |\n  | `exp`                              | Number (Timestamp)                          | The “expiration time” on or after which the JWT must not be accepted for processing.                                                                                                                                       |\n  | `azp`                              | String                                      | The application/client ID of the client using the token. The application can cat as itself or on behalf of a user.                                                                                                         |\n  | `gty`                              | String (Space-delimited)                    | The grant type that was used to request the token – not an RFC 7519 registered claim (Auth0-specific).                                                                                                                     |\n  | `permissions`                      | Array (Strings)                             | The grant type that was used to request the token – not an RFC 7519 registered claim (Auth0-specific).                                                                                                                     |\n\n  "
