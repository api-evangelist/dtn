  /feeds/v3/sounding/raw/{sounding_event_time}/{sounding_station_id}/{sounding_product_id}:
    get:
      tags:
      - Atmospheric Soundings
      summary: Retrieve specific Sounding product in raw form for given time and station
      description: Retrieve specific Sounding product in raw form for given time and station
      produces:
      - text/plain
      parameters:
      - $ref: '#/components/parameters/sounding_event_time'
      - $ref: '#/components/parameters/sounding_station_id'
      - $ref: '#/components/parameters/sounding_product_id'
      responses:
        '200':
          description: Raw Sounding Data
          content:
            application/json:
              example: "\n147 \nUSUS42 TJSJ 120000\nMANSJU\n78526 TTAA  62001 78526\n99014 25448 02505 00129 24850 07512 92809 19428 09510\n85534 15857 08506 70162 07459 04006 50585 08777 05523\n40756 17989 02536 30964 33180 34019 25090 43974 31029\n20236 55368 29025 15414 64968 31038 10655 74366 34024\n88999\n77999\n31313 44108 82302=\n\n\n"
components:
  parameters:
    sounding_event_time:
      name: sounding_event_time
      in: path
      description: event time, as returned from current or historical station listing
      required: true
      schema:
        type: string
    sounding_station_id:
      name: sounding_station_id
      in: path
      description: id of station reporting the sounding
      required: true
      schema:
        type: string
    month:
      name: month
      in: path
      description: 2 digit month, 01-12
      required: true
      schema:
        type: string
    day:
      name: day
      in: path
      description: 2 digit day, 01-31
      required: true
      schema:
        type: string
    sounding_product_id:
      name: sounding_product_id
      in: path
      description: 'sounding product; one of: ABV, MAN, SGL'
      required: true
      schema:
        type: string
    year:
      name: year
      in: path
      description: 4 digit year, e.g. 2026
      required: true
      schema:
        type: string
  headers:
    content-type:
      description: MIME-type of returned data
      schema:
        type: string
  responses:
    sounding_list:
      description: Sounding List
      headers:
        Content-Type:
          $ref: '#/components/headers/content-type'
