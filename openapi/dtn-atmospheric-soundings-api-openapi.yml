openapi: 3.2.0
info:
  description: RadarScope Radar Data API
  version: 3.0.0
  title: RadarScope Radar Data Atmospheric Soundings API
servers:
- url: https://radarscope-feeds.wdtinc.com
schemes:
- https
tags:
- name: Atmospheric Soundings
  description: Atmospheric Soundings
paths:
  /feeds/v3/sounding:
    get:
      tags:
      - Atmospheric Soundings
      summary: List stations with current Soundings
      description: List stations with current Soundings
      produces:
      - application/json
      parameters: []
      responses:
        '200':
          $ref: '#/components/responses/sounding_list'
  /feeds/v3/sounding/archive/{year}/{month}/{day}:
    get:
      tags:
      - Atmospheric Soundings
      summary: List stations with historic Soundings on a given day
      description: List stations with historic Soundings on a given day
      produces:
      - application/json
      parameters:
      - $ref: '#/components/parameters/year'
      - $ref: '#/components/parameters/month'
      - $ref: '#/components/parameters/day'
      responses:
        '200':
          $ref: '#/components/responses/sounding_list'
  /feeds/v3/sounding/{sounding_event_time}/{sounding_station_id}:
