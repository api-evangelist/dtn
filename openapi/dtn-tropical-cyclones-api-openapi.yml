openapi: 3.2.0
info:
  description: RadarScope Radar Data API
  version: 3.0.0
  title: RadarScope Radar Data Tropical Cyclones API
servers:
- url: https://radarscope-feeds.wdtinc.com
schemes:
- https
tags:
- name: Tropical Cyclones
  description: Tropical Cyclones
paths:
  /feeds/v3/tropical_cyclone/advisories:
    get:
      tags:
      - Tropical Cyclones
      summary: Get current tropical cyclone advisories
      description: Get current tropical cyclone advisories
      produces:
      - application/json
      parameters: []
      responses:
        '200':
          $ref: '#/components/responses/tropical_cyclone_advisory_list'
  /feeds/v3/tropical_cyclone/advisories/archive/{year}/{month}/{day}/{hour}/{minute}:
    get:
      tags:
      - Tropical Cyclones
      summary: Get historical tropical cyclone advisories for given timestamp
      description: Get historical tropical cyclone advisories for given timestamp
      produces:
      - application/json
      parameters:
      - $ref: '#/components/parameters/year'
      - $ref: '#/components/parameters/month'
      - $ref: '#/components/parameters/day'
      - $ref: '#/components/parameters/hour'
      - $ref: '#/components/parameters/minute'
      responses:
        '200':
          $ref: '#/components/responses/tropical_cyclone_advisory_list'
  /feeds/v3/tropical_cyclone/advisories/{year}/{storm_code}/{storm_update_number}:
    get:
      tags:
      - Tropical Cyclones
      summary: Get raw advisory text for a tropical cyclone
      description: Get raw advisory text for a tropical cyclone
      produces:
      - text/plain
      parameters:
      - $ref: '#/components/parameters/year'
      - $ref: '#/components/parameters/storm_code'
      - $ref: '#/components/parameters/storm_update_number'
      responses:
        '200':
          description: Tropical Cyclone Advisory Text
          content:
            text/plain:
              example: "\n772 \nWTNT32 KNHC 261439\nTCPAT2\n \nBULLETIN\nPost-Tropical Cyclone Gabrielle Advisory Number  39\nNWS National Hurricane Center Miami FL       AL072025\n300 PM GMT Fri Sep 26 2025\n \n...CENTER OF GABRIELLE CONTINUES MOVING AWAY FROM THE AZORES...\n...THIS IS THE FINAL NHC ADVISORY...\n \n \nSUMMARY OF 300 PM GMT...1500 UTC...INFORMATION\n----------------------------------------------\nLOCATION...40.0N 22.8W\nABOUT 245 MI...395 KM ENE OF LAJES AIR BASE IN THE AZORES\nMAXIMUM SUSTAINED WINDS...65 MPH...100 KM/H\nPRESENT MOVEMENT...ENE OR 65 DEGREES AT 31 MPH...50 KM/H\nMINIMUM CENTRAL PRESSURE...992 MB...29.30 INCHES\n \n \nWATCHES AND WARNINGS\n--------------------\nThere are no coastal watches or warnings in effect.\n \n \nDISCUSSION AND OUTLOOK\n----------------------\nAt 300 PM GMT (1500 UTC), the center of Post-Tropical Cyclone\nGabrielle was located near latitude 40.0 North, longitude 22.8 West.\nThe post-tropical cyclone is moving toward the east-northeast near\n31 mph (50 km/h). A turn toward the east with a decrease in forward \nspeed is expected through Saturday, followed by a turn toward the \nsoutheast and south through early next week. On the forecast track, \nthe center of post-tropical Gabrielle will continue moving away from \nthe Azores today, then approach the coast of Portugal by early \nSunday.\n \nMaximum sustained winds are near 65 mph (100 km/h) with higher\ngusts.  Some strengthening is forecast through tonight, with \nweakening expected over the weekend.\n \nTropical-storm-force winds extend outward up to 175 miles (280 km)\nfrom the center.\n \nThe estimated minimum central pressure is 992 mb (29.30 inches).\n \n \nHAZARDS AFFECTING LAND\n----------------------\nKey messages for Gabrielle can be found in the Tropical Cyclone\nDiscussion under AWIPS header MIATCDAT2 and WMO header WTNT42 KNHC.\n \nWIND: Gusty winds across the central and southeastern Azores will\ncontinue to diminish this afternoon.\n \nRAINFALL: Gabrielle is expected to produce less than an inch, or 25\nmm, of additional rainfall across the Azores today. Any flooding\ncaused by Gabrielle across the terrain of the central Azores should\nsubside today.\n \nSURF: Swells generated by Gabrielle will affect the Azores through\nthe weekend and will reach the coasts of Portugal, northwestern\nSpain, and northern Morocco on Saturday. These swells are expected\nto produce life-threatening surf and rip current conditions. Please\nconsult products issued by your local weather office.\n \n \nNEXT ADVISORY\n-------------\nThis is the last public advisory issued by the National Hurricane \nCenter on this system. Future information on marine impacts can be \nfound in High Seas Forecasts issued by Meteo France under WMO header \nFQNT50 LFPW and available on the web at \nhttps://tgftp.nws.noaa.gov/data/raw/fq/fqnt50.lfpw..txt. Future \ninformation on potential land-based impacts in Portugal can be found \nin products issued by the Portugal Meteorological Institute at \nhttps://www.ipma.pt/en/index.html\n \n$$\nForecaster Hagen\n \n\n"
  /feeds/v3/tropical_cyclone/forecasts:
    get:
      tags:
      - Tropical Cyclones
      summary: Get current tropical cyclone forecasts
      description: Get current tropical cyclone forecasts
      produces:
      - application/json
      parameters: []
      responses:
        '200':
          $ref: '#/components/responses/tropical_cyclone_forecast_list'
  /feeds/v3/tropical_cyclone/forecasts/archive/{year}/{month}/{day}/{hour}/{minute}:
    get:
      tags:
      - Tropical Cyclones
      summary: Get historical tropical cyclone forecasts for given timestamp
      description: Get historical tropical cyclone forecasts for given timestamp
      produces:
      - application/json
      parameters:
      - $ref: '#/components/parameters/year'
      - $ref: '#/components/parameters/month'
      - $ref: '#/components/parameters/day'
      - $ref: '#/components/parameters/hour'
      - $ref: '#/components/parameters/minute'
      responses:
        '200':
          $ref: '#/components/responses/tropical_cyclone_forecast_list'
  /feeds/v3/tropical_cyclone/forecasts/{year}/{storm}/{update}:
    get:
      tags:
      - Tropical Cyclones
      summary: Get raw forecast text for tropical cyclone
      description: Get raw forecast text for tropical cyclone
      produces:
      - text/plain
      parameters:
      - $ref: '#/components/parameters/year'
      - $ref: '#/components/parameters/storm_code'
      - $ref: '#/components/parameters/storm_update_number'
      responses:
        '200':
          description: Tropical Cyclone Forecast Text
          content:
            text/plain:
              example: "\n983 \nWTNT22 KNHC 261437\nTCMAT2\n \nPOST-TROPICAL CYCLONE GABRIELLE FORECAST/ADVISORY NUMBER  39\nNWS NATIONAL HURRICANE CENTER MIAMI FL       AL072025\n1500 UTC FRI SEP 26 2025\n \nPOST-TROPICAL CYCLONE CENTER LOCATED NEAR 40.0N  22.8W AT 26/1500Z\nPOSITION ACCURATE WITHIN  30 NM\n \nPRESENT MOVEMENT TOWARD THE EAST-NORTHEAST OR  65 DEGREES AT  27 KT\n \nESTIMATED MINIMUM CENTRAL PRESSURE  992 MB\nMAX SUSTAINED WINDS  55 KT WITH GUSTS TO  65 KT.\n50 KT.......  0NE  70SE  60SW  40NW.\n34 KT.......100NE 140SE 120SW 150NW.\n4 M SEAS.... 60NE 150SE 480SW 330NW.\nWINDS AND SEAS VARY GREATLY IN EACH QUADRANT.  RADII IN NAUTICAL\nMILES ARE THE LARGEST RADII EXPECTED ANYWHERE IN THAT QUADRANT.\n \nREPEAT...CENTER LOCATED NEAR 40.0N  22.8W AT 26/1500Z\nAT 26/1200Z CENTER WAS LOCATED NEAR 39.7N  24.2W\n \nFORECAST VALID 27/0000Z 40.8N  18.6W...POST-TROP/EXTRATROP\nMAX WIND  60 KT...GUSTS  75 KT.\n50 KT...  0NE  60SE  60SW  50NW.\n34 KT...120NE 150SE 120SW 150NW.\n \nFORECAST VALID 27/1200Z 41.0N  13.8W...POST-TROP/EXTRATROP\nMAX WIND  50 KT...GUSTS  60 KT.\n50 KT...  0NE   0SE  60SW  50NW.\n34 KT...110NE 120SE 140SW 150NW.\n \nFORECAST VALID 28/0000Z 40.1N  10.4W...POST-TROP/EXTRATROP\nMAX WIND  45 KT...GUSTS  55 KT.\n34 KT...  0NE  60SE 100SW 110NW.\n \nFORECAST VALID 28/1200Z 38.5N   8.3W...POST-TROP/EXTRATROP\nMAX WIND  35 KT...GUSTS  45 KT.\n34 KT...  0NE   0SE  70SW  70NW.\n \nFORECAST VALID 29/0000Z 36.9N   7.2W...POST-TROP/EXTRATROP\nMAX WIND  30 KT...GUSTS  40 KT.\n \nFORECAST VALID 29/1200Z 35.6N   7.1W...POST-TROP/EXTRATROP\nMAX WIND  25 KT...GUSTS  35 KT.\n \nEXTENDED OUTLOOK. NOTE...ERRORS FOR TRACK HAVE AVERAGED NEAR 125 NM\nON DAY 4 AND 175 NM ON DAY 5...AND FOR INTENSITY NEAR 15 KT EACH DAY\n \nOUTLOOK VALID 30/1200Z...DISSIPATED\n \nREQUEST FOR 3 HOURLY SHIP REPORTS WITHIN 300 MILES OF 40.0N  22.8W\n \nTHIS IS THE LAST FORECAST/ADVISORY ISSUED BY THE NATIONAL HURRICANE \nCENTER ON THIS SYSTEM. ADDITIONAL INFORMATION ON THIS SYSTEM CAN BE \nFOUND IN HIGH SEAS FORECASTS ISSUED BY METEO FRANCE...UNDER WMO \nHEADER FQNT50 LFPW.\n \n$$\nFORECASTER HAGEN\n \n \n\n"
  /feeds/v3/tropical_cyclone/summaries:
    get:
      tags:
      - Tropical Cyclones
      summary: Get current tropical cyclone summaries
      description: Get current tropical cyclone summaries
      produces:
      - application/json
      parameters: []
      responses:
        '200':
          $ref: '#/components/responses/tropical_cyclone_summary_list'
  /feeds/v3/tropical_cyclone/summaries/archive/{year}/{month}/{day}/{hour}/{minute}:
    get:
      tags:
      - Tropical Cyclones
      summary: Get historical tropical cyclone summaries for given timestamp
      description: Get historical tropical cyclone summaries for given timestamp
      produces:
      - application/json
      parameters:
      - $ref: '#/components/parameters/year'
      - $ref: '#/components/parameters/month'
      - $ref: '#/components/parameters/day'
      - $ref: '#/components/parameters/hour'
      - $ref: '#/components/parameters/minute'
      responses:
        '200':
          $ref: '#/components/responses/tropical_cyclone_summary_list'
components:
  parameters:
    storm_update_number:
      name: storm_update_number
      in: path
      description: iterative update number, e.g. 1 - x
      required: true
      schema:
        type: string
    storm_code:
      name: storm_code
      in: path
      description: storm code, e.g. AL12, NOT English friendly name e.g. 'Lorenzo'
      required: true
      schema:
        type: string
    month:
      name: month
      in: path
      description: 2 digit month, 01-12
      required: true
      schema:
        type: string
    minute:
      name: minute
      in: path
      description: 2 digit minute, 00-59
      required: true
      schema:
        type: string
    day:
      name: day
      in: path
      description: 2 digit day, 01-31
      required: true
      schema:
        type: string
    year:
      name: year
      in: path
      description: 4 digit year, e.g. 2026
      required: true
      schema:
        type: string
    hour:
      name: hour
      in: path
      description: 2 digit hour, 00-23
      required: true
      schema:
        type: string
  headers:
    content-type:
      description: MIME-type of returned data
      schema:
        type: string
  responses:
    tropical_cyclone_advisory_list:
      description: Tropical Cyclone Advisory List
      headers:
        Content-Type:
          $ref: '#/components/headers/content-type'
      content:
        application/json:
          example: "[\n\t{\n\t\t\"c\": \"Gabrielle\",\n\t\t\"ph\": \"PTC\",\n\t\t\"a\": \"2025/AL07/39\",\n\t\t\"b\": 1758898800,\n\t\t\"iss\": 1758897540,\n\t\t\"o\": \"AL\",\n\t\t\"s\": \"AL07\",\n\t\t\"n\": \"39\",\n\t\t\"i\": {\n\t\t\t\"pos\": [\n\t\t\t\t-22.8,\n\t\t\t\t40.0\n\t\t\t],\n\t\t\t\"susmph\": 65,\n\t\t\t\"suskmh\": 100,\n\t\t\t\"minmb\": 992,\n\t\t\t\"minhg\": 29.3,\n\t\t\t\"movdir\": \"ENE\",\n\t\t\t\"movhdg\": 65,\n\t\t\t\"movmph\": 31,\n\t\t\t\"movkmh\": 50,\n\t\t\t\"headlines\": [\n\t\t\t\t\"CENTER OF GABRIELLE CONTINUES MOVING AWAY FROM THE AZORES\",\n\t\t\t\t\"THIS IS THE FINAL NHC ADVISORY\"\n\t\t\t],\n\t\t\t\"pl\": [\n\t\t\t\t\"ABOUT 245 MI...395 KM ENE OF LAJES AIR BASE IN THE AZORES\"\n\t\t\t]\n\t\t},\n\t\t\"bin\": \"AT2\"\n\t},\n\t{\n\t\t\"c\": \"Humberto\",\n\t\t\"ph\": \"HU\",\n\t\t\"a\": \"2025/AL08/9\",\n\t\t\"b\": 1758920400,\n\t\t\"iss\": 1758918840,\n\t\t\"o\": \"AL\",\n\t\t\"s\": \"AL08\",\n\t\t\"n\": \"9\",\n\t\t\"i\": {\n\t\t\t\"pos\": [\n\t\t\t\t-58.1,\n\t\t\t\t22.3\n\t\t\t],\n\t\t\t\"susmph\": 115,\n\t\t\t\"suskmh\": 185,\n\t\t\t\"minmb\": 962,\n\t\t\t\"minhg\": 28.41,\n\t\t\t\"movdir\": \"WNW\",\n\t\t\t\"movhdg\": 295,\n\t\t\t\"movmph\": 5,\n\t\t\t\"movkmh\": 7,\n\t\t\t\"headlines\": [\n\t\t\t\t\"HUMBERTO RAPIDLY STRENGTHENS TO A MAJOR HURRICANE\",\n\t\t\t\t\"FURTHER INTENSIFICATION EXPECTED OVER THE CENTRAL ATLANTIC\"\n\t\t\t],\n\t\t\t\"pl\": [\n\t\t\t\t\"ABOUT 430 MI...690 KM NE OF THE NORTHERN LEEWARD ISLANDS\"\n\t\t\t]\n\t\t},\n\t\t\"bin\": \"AT3\"\n\t},\n\t{\n\t\t\"c\": \"Nine\",\n\t\t\"ph\": \"PC\",\n\t\t\"a\": \"2025/AL09/1A\",\n\t\t\"b\": 1758931200,\n\t\t\"iss\": 1758930420,\n\t\t\"o\": \"AL\",\n\t\t\"s\": \"AL09\",\n\t\t\"n\": \"1A\",\n\t\t\"i\": {\n\t\t\t\"pos\": [\n\t\t\t\t-75.0,\n\t\t\t\t21.0\n\t\t\t],\n\t\t\t\"susmph\": 35,\n\t\t\t\"suskmh\": 55,\n\t\t\t\"minmb\": 1007,\n\t\t\t\"minhg\": 29.74,\n\t\t\t\"movdir\": \"WNW\",\n\t\t\t\"movhdg\": 300,\n\t\t\t\"movmph\": 10,\n\t\t\t\"movkmh\": 17,\n\t\t\t\"headlines\": [\n\t\t\t\t\"DISTURBANCE LOCATED NEAR THE COAST OF HOLGUIN CUBA\",\n\t\t\t\t\"SIGNIFICANT RAINFALL EXPECTED OVER PORTIONS OF EASTERN CUBA AND THE BAHAMAS THROUGH THE WEEKEND\"\n\t\t\t],\n\t\t\t\"pl\": [\n\t\t\t\t\"ABOUT 75 MI...120 KM NW OF THE EASTERN TIP OF CUBA\",\n\t\t\t\t\"ABOUT 185 MI...300 KM SSE OF THE CENTRAL BAHAMAS\"\n\t\t\t]\n\t\t},\n\t\t\"bin\": \"AT4\"\n\t}\n]"
    tropical_cyclone_summary_list:
      description: Tropical Cyclone Forecast List
      headers:
        Content-Type:
          $ref: '#/components/headers/content-type'
      content:
