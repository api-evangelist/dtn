  /v2/sun-moon:
    get:
      tags:
      - Endpoints
      summary: Sun and Moon
      description: "This endpoint provides comprehensive astronomical data including sunrise and sunset times, current moon phase, and more related to the Sun's and Moon's status for any specific point on Earth. Specify the location and an optional date range up to 15 days long. The API responds with the requested data in GeoJSON format.\n\nUse query parameters to control the results in the response body:\n\n  * Specify a location as latitude (`lat`) and longitude (`lon`).\n\n  * Two important parameters are `startDate` and `endDate`:\n    + The API returns data for the specified date range when both are specified.\n    + The API returns data for the specified UTC day when only `startTime` is specified.\n    + The API returns data for the current UTC day when neither are specified.\n\n  * Complete example: `https://astronomical.api.dtn.com/v2/sun-moon?lat={lat}&lon={lon}&startDate={start_date}&endDate={end_date}`\n"
      operationId: sunMoon
      security:
      - clientCredentials: []
      parameters:
      - in: header
        name: Accept-Encoding
        schema:
          type: string
          description: Use this request header to communicate which compression algorithms the client understands. The API supports gzip.
          example: gzip
      - in: header
        name: Accept
        schema:
          type: string
          description: Use this request header to specify an acceptable response media type.
          example: application/json
      - $ref: '#/components/parameters/lat'
      - $ref: '#/components/parameters/lon'
      - $ref: '#/components/parameters/startDate'
      - $ref: '#/components/parameters/endDate'
      responses:
        '200':
          description: A successful request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SunMoon'
        '400':
          $ref: '#/components/responses/bad-request'
        '401':
          $ref: '#/components/responses/unauthorized'
        '406':
          $ref: '#/components/responses/not-acceptable'
    servers:
    - url: https://astronomical.api.dtn.com
  /v1/daily/ten-year:
    get:
      tags:
      - Endpoints
      summary: Daily Climatology
      description: "This endpoint provides daily climatology parameters for any point on Earth. Specify the location, parameters of interest, and a date range up to 366 days (from January 1 through December 31, including February 29).  Results are valid from local midnight-to-midnight at the requested location and not specific to any year.\n\nUse the query string to customize the results in the response body:\n\n  * Specify a location as latitude (`lat`) and longitude (`lon`).  These are required.\n\n  * Specify `parameters` to filter the response to a specific, comma-separated list of environmental parameters. The API returns defaults when this is omitted.\n\n  * Specify `startDate` and `endDate` (using `MM-DD` format for month and day), or `startDate` alone for just one date.\n\n  * Specify `units=us-std` to receive values as United States customary (imperial) units. The API returns metric units by default and when `units=si-std` is expressly requested.\n\n  * Specify the `interval` parameter to request aggregated data for parameters such as airTempAvgAvg.\n    + **Format:** The interval must be in the format {n}, where {n} is an integer greater than 1 (e.g., 2, 6, or 12).\n\nAll together, a complete request looks like:\n\n```\nhttps://climatology.api.dtn.com/v1/daily/ten-year?lat={lat}&lon={lon}&startDate={start_date}&endDate={end_date}&interval={n}&parameters={param1,param2}&units={units}\n```\n"
      operationId: dailyClimatology
      security:
      - clientCredentials: []
      parameters:
      - in: header
        name: Accept-Encoding
        schema:
          type: string
          description: Use this request header to communicate which compression algorithms the client understands. The API supports gzip.
          example: gzip
      - in: header
        name: Accept
        schema:
          type: string
          description: Use this request header to specify an acceptable response media type.
          example: application/json
      - name: lat
        in: query
        schema:
          type: number
          format: float
        example: 35.47
        required: true
      - name: lon
        in: query
        schema:
          type: number
          format: float
        example: -97.51
        required: true
      - name: startDate
        in: query
        schema:
          type: string
          format: date-time
        example: 08-01
      - name: endDate
        in: query
        schema:
          type: string
          format: date-time
        example: 08-03
      - name: parameters
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
        example: airTempAvg,precipAmountAvg,windSpeedAvg
      - name: units
