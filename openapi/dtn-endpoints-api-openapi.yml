      summary: Marine Conditions
      description: "This endpoint provides forecast and historical conditions for any specific point in the ocean. Specify the location, the marine parameters of interest, and a time range up to 10 days long, from 10 years in the past to 10 days in the future. The API responds with the requested time series in GeoJSON format.\n\nCommon uses include weather monitoring, marine research, localized operations, and supply-chain management planning in ports and offshore platforms.\n\nUse query parameters to control the results in the response body:\n\n  * Specify a location as latitude (`lat`) and longitude (`lon`).\n\n  * Specify `parameters` to filter by specific marine weather parameters. Include multiple as comma-separated values. The API returns only defaults when no specific parameters are requested.\n\n  * Two important parameters are `startTime` and `endTime`:\n    + The API returns forecast data when `startTime` and `endTime` are in the future.\n    + The API returns historical data when `startTime` and `endTime` are in the past.\n    + The API returns only one exact timestamp when only `startTime` is specified.\n\n  * Complete example: `https://weather.api.dtn.com/v1/conditions/marine?lat={lat}&lon={lon}&startTime={start_time}&endTime={end_time}&parameters={param1,param2}`\n"
