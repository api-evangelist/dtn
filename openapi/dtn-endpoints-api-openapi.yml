                startTime:
                  type: string
                  format: date-time
                  example: '1995-01-01T00:00:00Z'
                endTime:
                  type: string
                  format: date-time
                  example: '1995-01-10T00:00:00Z'
                parameters:
                  type: array
                  items:
                    type: string
                    example: airTemp
                  example:
