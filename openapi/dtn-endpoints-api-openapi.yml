  /v1/hub-height-winds/forecast:
    get:
      tags:
      - Endpoints
      summary: Hub Height Winds Forecast
      description: "This endpoint provides forecast wind parameters from 10-300 meters above ground level for any point on Earth. Specify the location, parameters of interest, and a time range from now until 15 days ahead. The API responds with the requested time series in GeoJSON format.\n\nUse the query string to customize the results in the response body:\n\n  * Specify a location as latitude (`lat`) and longitude (`lon`).  These are required.\n\n  * Specify `parameters` to filter the response to a specific, comma-separated list of environmental parameters. The API returns defaults when this is omitted.\n\n  * Specify `startTime` and `endTime` (using [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.8) format) for a forecast time range, or `startTime` alone for just one timestamp.\n\n  * Specify `units=us-std` to receive values as United States customary (imperial) units. The API returns metric units by default and when `units=si-std` is expressly requested.\n\n  * Specify `interval` to obtain sub-hourly (interpolated) or multi-hour (aggregated) results. The API returns hourly results by default.\n\nAll together, a complete request looks like:\n\n```\nhttps://renewables.api.dtn.com/v1/hub-height-winds/forecast?lat={lat}&lon={lon}&startTime={start_time}&endTime={end_time}&interval={interval}&parameters={param1,param2}&units={units}\n```\n\n### How to change timesteps\n\nTo interpolate to sub-hourly timesteps, specify `interval=15m`, `interval=30m`, or `interval=45m` in the query string.  For example:\n\n  * `?lat=35.47&lon=-97.51&startTime=2024-10-01T00:00:00Z&endTime=2024-10-10T00:00:00Z&interval=15m&parameters=windDirection10m,windSpeed10m`\n\n  * `?lat=35.47&lon=-97.51&startTime=2024-10-01T00:00:00Z&endTime=2024-10-10T00:00:00Z&interval=30m&parameters=windDirection10m,windSpeed10m`\n\n  * `?lat=35.47&lon=-97.51&startTime=2024-10-01T00:00:00Z&endTime=2024-10-10T00:00:00Z&interval=45m&parameters=windDirection10m,windSpeed10m`\n\nTo aggregate over multiple hours, specify `interval={n}h` in the query string using a whole number of hours for `{n}`, from 2 to the timespan between `startTime` and `endTime`. Also, substitute the desired aggregation parameter names from the `Parameters` section. For example:\n\n  * `?lat=35.47&lon=-97.51&startTime=2024-10-01T00:00:00Z&endTime=2024-10-10T00:00:00Z&interval=2h&parameters=windDirection10mAvg,windSpeed10mMax`\n\n  * `?lat=35.47&lon=-97.51&startTime=2024-10-01T00:00:00Z&endTime=2024-10-10T00:00:00Z&interval=6h&parameters=windDirection10mAvg,windSpeed10mMax`\n\n  * `?lat=35.47&lon=-97.51&startTime=2024-10-01T00:00:00Z&endTime=2024-10-10T00:00:00Z&interval=24h&parameters=windDirection10mAvg,windSpeed10mMax`\n\nIn special cases, daily aggregations might require local timezone-aware aggregations to account of days with an one extra or less hour.  In these cases, specify `interval=1d` along with timezone-aware `startTime` and `endTime` values.  For example:\n\n  * `?lat=35.47&lon=-97.51&startTime=2024-11-03T00:00:00&endTime=2024-11-04T23:59:59&interval=1d&parameters=windDirection10mAvg,windSpeed10mMax`\n\n  * `?lat=35.47&lon=-97.51&startTime=2024-03-09T00:00:00&endTime=2024-03-10T23:59:59&interval=1d&parameters=windDirection10mAvg,windSpeed10mMax`\n\n### How to change timezones\n\nTypically, `startTime` and `endTime` end with `Z` to indicate UTC time.  For example:\n\n  * `?lat=35.47&lon=-97.51&startTime=2024-10-01T00:00:00Z&endTime=2024-10-10T00:00:00Z`\n\nTo change timezones, specify a UTC offset (such as `+08:00` or `-05:00`) instead of `Z`. Note that the `+` symbol is a special URL character that must be encoded as `%2B`.  For example:\n\n  * `?lat=35.47&lon=-97.51&startTime=2024-10-01T00:00:00-05:00&endTime=2024-10-10T00:00:00-05:00`\n  * `?lat=35.47&lon=-97.51&startTime=2024-10-01T00:00:00%2B08:00&endTime=2024-10-10T00:00:00%2B08:00`\n  * `?lat=35.47&lon=-97.51&startTime=2024-10-01T00:00:00-05:00&endTime=2024-10-10T00:00:00%2B08:00`\n\nTo obtain the local timezone at the requested location, omit the suffix entirely. For example:\n\n  * `?lat=35.47&lon=-97.51&startTime=2024-10-01T00:00:00&endTime=2024-10-10T00:00:00`\n  * Fractional time zones\n      + Parameters:\n        + **startTime:** 2025-07-04T00:00:00\n        + **endTime:** 2025-07-04T23:59:59\n        + **interval:** 24h\n        + **lat:** 30.251\n        + **lon:** 62.569\n        \n      + Response:\n        ```json\n        \"properties\": {\n            \"2025-07-03T23:30:00+0430\": {\n                \"windDirection100mAvg\": 309,\n                \"windGust100mMax\": 8.6,\n                \"windGust100mMin\": 4.9,\n                \"windGust100mAvg\": 6.2,\n                \"windSpeed100mMax\": 6.6,\n                \"windSpeed100mMin\": 3.2,\n                \"windSpeed100mAvg\": 4.3\n            },\n            \"2025-07-04T23:30:00+0430\": {\n                \"windDirection100mAvg\": 325,\n                \"windGust100mMax\": 8.1,\n                \"windGust100mMin\": 8.1,\n                \"windGust100mAvg\": 8.1,\n                \"windSpeed100mMax\": 6,\n                \"windSpeed100mMin\": 6,\n                \"windSpeed100mAvg\": 6\n            }\n        }\n        ```\n      * Explanation:\n        * **Why** This response seems confusing at first becuase we have 2 data points when we seemingly only requested a single 24 hour interval.\n        * **Local Timezone Assumption** When requesting a start and end time that has no timezone, the timezone of the location requested will be used.\n          * For the example requested lat/lon the local timezone is UTC+04:30 (fractional timezone)\n        * **Inclusive Time Range** startTime is hour inclusive, meaning the API will return data for the top of the requested hour (in UTC).\n        * **UTC Conversion** All data is stored in UTC hourly.\n          * When we convert these requested timestamps to UTC, `startTime=2025-07-03T19:30:00Z`, `endTime=2025-07-04T19:29:59Z`\n        * Since startTime and endTime are `inclusive`, so the time range spans exactly 25 hours, not 24.\n        * Changing `endTime` to `2025-07-04T23:00:00` will result in a single interval returned.\n\nIn all cases, timestamps in the API response automatically match the timezone indicated by `startTime`.\n"
      operationId: hubHeightWindsForecast
      security:
      - clientCredentials: []
      parameters:
      - in: header
