          type: string
        example: us-std
      responses:
        '200':
          description: A successful request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  type:
                    type: string
                  features:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                        geometry:
                          type: object
                          properties:
                            type:
                              type: string
                            coordinates:
                              type: array
                              items:
                                type: number
                        properties:
                          type: object
                          properties:
                            '2024-10-01T00:00:00Z':
                              type: object
                              properties:
                                windDirection10m:
                                  type: number
