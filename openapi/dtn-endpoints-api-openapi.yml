  /v1/conditions/marine/spectra:
    get:
      tags:
      - Endpoints
      summary: Marine Spectra
      description: "This endpoint provides the hourly forecast 2D spectra wave data for a specified location and time range. Spectra 2D wave data represents the distribution of wave energy across various frequencies and directions at specific timestamps. This detailed information is crucial for understanding complex sea states and optimizing operations in offshore and shipping projects.\n\nFor example, it can be used to enhance the stability and safety of offshore platforms or to optimize routing for shipping vessels to avoid severe sea conditions. The response is a CSV file, containing spectral wave data with associated energy values for each frequency and direction.\n\nUse query parameters to control the results in the response body:\n\n  * Specify a location as latitude (`lat`) and longitude (`lon`).\n\n  * Two important parameters are `startTime` and `endTime`:\n    + The API returns forecast data when `startTime` and `endTime` are in the future.\n    + The API does not support `startTime` and `endTime` are in the past.\n    + The API returns only one exact timestamp when only `startTime` is specified.\n\n  * Complete example: `https://weather.api.dtn.com/v1/conditions/marine/spectra?lat={lat}&lon={lon}&startTime={start_time}&endTime={end_time}`\n\n## Response Format\nThe response is a custom CSV describing the distribution of wave energy at different frequencies coming from multiple directions.\n\n<table style=\"border-collapse:collapse;border-spacing:0\" class=\"tg\"><thead>\n<tr><th style=\"background-color:#FED327;border-color:black;border-style:solid;border-width:1px;font-family:Arial, sans-serif;font-size:14px;font-weight:normal;overflow:hidden;padding:10px 5px;text-align:left;vertical-align:top;word-break:normal\"><span style=\"background-color:#FED327\"> </span><br>-34.9<span style=\"background-color:#FED327\"> </span></th><th style=\"background-color:#FED327;border-color:black;border-style:solid;border-width:1px;font-family:Arial, sans-serif;font-size:1