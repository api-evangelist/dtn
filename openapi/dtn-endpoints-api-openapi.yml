    servers:
    - url: https://precipitation.api.dtn.com
  /v1/probabilistic:
    get:
      tags:
      - Endpoints
      summary: Probabilistic Weather Forecast
      description: "This endpoint provides probabilistic weather forecasts for any specific point on the globe. Specify the location, the probabilistic parameters of interest, and a time range up to 10 days in the future.\n\nCommon uses include risk assessment, decision-making under uncertainty, and operations planning with specific confidence levels.\n\n## Using timezone offsets\n\nTo change timezones, specify a UTC offset (such as `+08:00` or `-05:00` instead of `Z`) for query parameters `startTime` and `endTime`. Timestamps in the response will automatically match the `startTime` offset. Remove the offset entirely to obtain the local timezone for the requested location.\n\n\n\n#### Valid examples\n\n* `?startTime=2024-01-01T00:00:00Z&endTime=2024-01-01T23:00:00Z`\n\n* `?startTime=2024-01-01T00:00:00%2B08:00&endTime=2024-01-01T23:00:00+02:00`\n\n* `?startTime=2024-01-01T00:00:00-08:00&endTime=2024-01-01T23:00:00-08:00`\n\n* `?startTime=2024-01-01T00:00:00&endTime=2024-01-01T23:00:00`\n\n\n### Latitude and Longitude\n\n**Important note**: Requested latitudes and longitudes in response are rounded to five (5) decimal places when presented in `$.features.*.geometry.coordinates`. Floating point precision might affect the last digit.\n\n### Rounding examples\n\n* 1.5555 => 1.556\n\n* 1.5545 => 1.554\n\n* -1.5555 => -1.556\n\n\n## Query Parameters:\nUse query parameters to control the results in the response body:\n### location\n* Specify a location as latitude (`lat`) and longitude (`lon`).\n\n### parameters\n* Specify `parameters` to filter by specific probabilistic weather parameters. Include multiple as comma-separated values.\n\n### startTime and endTime\n* Two key parameters are `startTime` and `endTime`. These parameters determine the time range for which the API returns probabilistic forecast data. Both `startTime` and `endTime` are inclusive, meaning that data at the top of the UTC hour for both timestamps is included in the response.\n\n* API Behavior Based on startTime and endTime:\n\n  * **Omitted startTime and endTime:** Returns current probabilistic conditions.\n\n  * **Both in the Future:** Returns probabilistic forecast data when both `startTime` and `endTime` are in the future.\n\n  * **Only startTime Specified:** Returns only one timestamp, representing the probabilistic data at the specified `startTime`.\n\n* Inclusivity of Timestamps\n\n  * **Inclusive `startTime` and `endTime`:** Both parameters are inclusive, affecting the total duration and the number of data points returned.\n\n\n### units\n  * Use `units` to request values either as SI (metric) or United States customary (imperial) units.\n    + The API returns metric units by default and when `si-std` is specified.\n    + The API returns imperial units only when `us-std` is specified.\n\nAll together, a complete request looks like:\n\n```\nhttps://probabilistic.api.dtn.com/v1/probabilistic?lat={lat}&lon={lon}&startTime={start_time}&endTime={end_time}&parameters={param1,param2}&units={units}\n```\n"
      operationId: probabilisticForecast
      security:
      - clientCredentials: []
      parameters:
      - in: header
        name: Accept-Encoding
        schema:
          type: string
          description: Use this request header to communicate which compression algorithms the client understands. The API supports gzip.
          example: gzip
      - in: header
        name: Accept
        schema:
          type: string
          description: Use this request header to specify an acceptable response media type.
          example: application/json
      - name: lat
        in: query
        schema:
          type: number
          format: float
          minimum: -90
          maximum: 90
        example: 35.47
        required: true
        description: Latitude coordinate in decimal degrees
      - name: lon
        in: query
        schema:
          type: number
          format: float
          minimum: -180
          maximum: 180
        example: -97.51
        required: true
        description: Longitude coordinate in decimal degrees
      - name: startTime
        in: query
        schema:
          type: string
          format: date-time
        example: '2024-08-15T00:00:00Z'
        description: Start time for forecast period in ISO 8601 format. If no timezone is specified, defaults to local timezone of the requested location. Use timezone offset (e.g., "+05:00") or "Z" for UTC.
      - name: endTime
        in: query
        schema:
          type: string
          format: date-time
        example: '2024-08-17T00:00:00Z'
        description: End time for forecast period in ISO 8601 format. If no timezone is specified, defaults to local timezone of the requested location. Use timezone offset (e.g., "+05:00") or "Z" for UTC.
      - name: parameters
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
        example: airTempP10,airTempP90,windSpeedPoE10
        description: Comma-separated list of probabilistic parameters to include in response
      - name: units
        in: query
        schema:
          type: string
          enum:
          - si-std
          - us-std
          default: si-std
        example: us-std
        description: Unit system for response values (si-std for metric, us-std for imperial)
      responses:
        '200':
          description: A successful request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    description: The request URL
                  type:
                    type: string
                    description: GeoJSON type
                    example: FeatureCollection
                  features:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          example: Feature
                        geometry:
                          type: object
                          properties:
                            type:
                              type: string
                              example: Point
                            coordinates:
                              type: array
                              items:
                                type: number
                              example:
                              - -97.51
                              - 35.47
                        properties:
                          type: object
                          description: Time-series data with probabilistic parameters
                          additionalProperties:
                            type: object
                            description: Probabilistic forecast data for a specific time
                            properties:
                              airTempP10:
                                type: number
                                description: 10th percentile air temperature
                              airTempP25:
                                type: number
                                description: 25th percentile air temperature
                              airTempP50:
                                type: number
                                description: 50th percentile air temperature (median)
                              airTempP75:
                                type: number
                                description: 75th percentile air temperature
                              airTempP90:
                                type: number
                                description: 90th percentile air temperature
                              airTempPoE0:
                                type: number
                                description: Probability of air temperature exceeding 0°C
                              airTempPoE15:
                                type: number
                                description: Probability of air temperature exceeding 15°C
                              windSpeedP10:
                                type: number
                                description: 10th percentile wind speed
                              windSpeedP50:
                                type: number
                                description: 50th percentile wind speed (median)
                              windSpeedP90:
                                type: number
                                description: 90th percentile wind speed
                              windSpeedPoE10:
                                type: number
                                description: Probability of wind speed exceeding 10 m/s
                              windSpeedGustP50:
                                type: number
                                description: 50th percentile wind gust (median)
                              windSpeedGustP90:
                                type: number
                                description: 90th percentile wind gust
                              windSpeedGustPoE15:
                                type: number
