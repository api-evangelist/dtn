openapi: 3.2.0
info:
  title: Dtn NOTAM API
  version: '1.0'
  description: 'Operations tagged NOTAM across 2 of this provider''s published API definitions: dtn-notams-api-openapi.json, dtn-websocket-api-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://aviation.api.dtn.com
security:
- clientCredentials: []
tags:
- name: NOTAM
  description: World wide NOTAMS available from various sources, FAA SWIM, EAD and others. Using a hierarchy to avoid duplicated NOTAMS
paths:
  /v1/notams/:
    get:
      tags:
      - NOTAM
      summary: Get NOTAMs for a Station
      description: Get all available NOTAMs for a specific Station ID
      responses:
        '200':
          $ref: '#/components/responses/NotamSuccess'
        '400':
          $ref: '#/components/responses/NotamBadRequest'
        '401':
          $ref: '#/components/responses/ErrorUnauthorized'
      parameters:
      - $ref: '#/components/parameters/QueryStationId'
      - $ref: '#/components/parameters/QueryOffset'
      - $ref: '#/components/parameters/QueryLimit'
      - $ref: '#/components/parameters/QueryPreferNotamType'
      - $ref: '#/components/parameters/QueryOnlyNotamType'
      security:
      - clientCredentials: []
    servers:
    - url: https://aviation.api.dtn.com
components:
  schemas:
    NotamList:
      type: object
      properties:
        url:
          type: string
        notams:
          type: array
          items:
            $ref: '#/components/schemas/NotamItem'
        meta:
          $ref: '#/components/schemas/Meta'
    Meta:
      title: Meta
      description: Meta data attached to every response
      required:
      - name
      - request_id
      - start_timestamp
      - end_timestamp
      - execution_time
      type: object
      properties:
        name:
          type: string
        request_id:
          type: string
        start_timestamp:
          type: integer
        end_timestamp:
          type: integer
        execution_time:
          type: integer
    NotamItem:
      type: object
      properties:
        stationId:
          type: string
        notamId:
          type: string
        raw_text:
          type: string
        issueDateTime:
          type: string
          format: date-time
        expireDateTime:
          type:
          - string
          - 'null'
          format: date-time
    Error:
      title: Error
      description: Error
      required:
      - type
      - title
      - status
      - detail
      - meta
      type: object
      properties:
        url:
          type: string
        type:
          enum:
          - internal-server-error
          - unauthorized
          - bad-request
          - service-unavailable
          - forbidden
          - not-found
          type: string
        title:
          type: string
        status:
          type: number
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          items:
            type: object
        meta:
          $ref: '#/components/schemas/Meta'
  examples:
    NotamBadRequestResponse:
      value:
        url: http://localhost:3000/v1/notams/KIND?offset=-1&limit=10
        type: bad-request
        title: Invalid Request
        status: 400
        detail: Validation failed.
        instance: urn:dtn:aviation-api:/v1/notams/KIND:requestId:895f33f9-925d-42df-9500-32fabbbd813c
        errors:
        - message: '`offset` query must be Integer zero or greater'
          parameter: offset
          value: -1
        meta:
          name: v1.notams.KIND?offset=-1&limit=10
          uuid: b90dae85-86f6-4b79-a747-8dfd0655d36c
          request_id: 895f33f9-925d-42df-9500-32fabbbd813c
          start_timestamp: 1714013205229
          end_timestamp: 1714013205461
          execution_time: 232
    NotamSuccessResponse:
