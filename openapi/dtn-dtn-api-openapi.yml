  /v1/cyclone-radii:
    get:
      tags:
      - DTN
      summary: Get Radii
      description: "Returns Array of FeatureCollection Objects, Contain wind radii features. \n\n**Data returned from this endpoint contains data from DTN advisories ONLY**\n\nGeoJSON Properties:\n\n* **stormElement** ***(string)***: Type of storm element (\"FORECAST_RADII\" in this case).\n* **radiiType** ***(string)***: Type of wind radii being provided (e.g., \"34kt\" for 34-knot winds).\n* **forecastHour** ***(integer)***: Forecast hour for which the wind radii are valid.\n* **ne** ***(integer)***: Radius of the wind field in the northeast quadrant (in nautical miles).\n* **se** ***(integer)***: Radius of the wind field in the southeast quadrant (in nautical miles).\n* **sw** ***(integer)***: Radius of the wind field in the southwest quadrant (in nautical miles).\n* **nw** ***(integer)***: Radius of the wind field in the northwest quadrant (in nautical miles).\n* **validDateTime** ***(string)***: Date and time when the forecast is valid in UTC format (YYYY-MM-DDTHH:MM:SSZ).\n* **category** ***(integer)***: Storm category (Saffir-Simpson Hurricane Wind Scale) based on the wind speed.\n* **windSpeedKnots** ***(float)***: Wind speed of the storm in knots."
      operationId: get_radii_v1_cyclone_radii_get
      security:
      - clientCredentials: []
      parameters:
      - name: stormName
        in: query
        required: false
        schema:
          type: string
          description: 'Optional: Filter results by name of storm'
          title: Stormname
        description: 'Optional: Filter results by name of storm'
      - name: stormNum
        in: query
        required: false
        schema:
          type: string
          description: 'Optional: Filter results by number of storm'
          title: Stormnum
        description: 'Optional: Filter results by number of storm'
