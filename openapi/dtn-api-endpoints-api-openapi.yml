    servers:
    - url: https://obs.api.dtn.com
  /v2/observations/stations:
    get:
      tags:
      - API Endpoints
      summary: Stations
      description: 'Use this endpoint to retrieve station metadata and details about available observation types. You can search for one or more stations by providing their `stationCodes` in a single request.


        ### Station Metadata


        Each station record includes key metadata fields such as:


        - **Elevation** — height above mean sea level, expressed in meters (SI units)

        - **Location** — latitude and longitude

        - **Observation Types (obsTypes)** — list of supported observation categories (see table below)

        - **Available Parameters (parameters)** — list of observation parameters that can be requested from this station via the `/observations` endpoint

        - **Archive Availability (isArchived)** — indicates whether historical data is available

        - **Observation Timestamps** — includes both the first and latest observation times for that station

        - **Tags** — identifiers and metadata such as ICAO, WMO, IATA, GHCND, and station name


        ### Quota Usage


        Quota usage is calculated **per returned station**, not per API request.


        **Example:** If you request metadata for 50 stations and all 50 are returned, your quota usage is 50 stations. The quota is applied based on the number of stations returned in the response, regardless of how many you requested.


        ### Access Scopes


        Your account scope determines which stations you can access:


        | Feature | Core Scope | Plus Scope |

        |---------|------------|------------|

        | **Station Access** | Public stations only | Public stations + DTN EU stations |

        | **Coverage** | Global public networks (METAR, SYNOP, etc.) | All public networks + DTN''s European private network |

        | **Typical Use Cases** | General weather monitoring, basic applications | Professional applications requiring comprehensive European coverage |


        > **Note:** To check your current scope or upgrade, contact apisupport@dtn.com


        ### Observation Types (obsTypes)


        The `obsTypes` field identifies the type or source network of a weather station''s observations. Each observation type reflects a specific network, instrumentation standard, or operational purpose, which determines the kind of data available, its frequency, and its reliability.


        | obsType | Description |

        |---------|-------------|

        | **SYNOP** | Surface synoptic observation stations (typically WMO official sites, government-operated). |

        | **METAR** | Meteorological Terminal Air Reports, primarily for aviation use. Global coverage across airfields. |

        | **Citizen** | Individually operated stations (primarily report `precipAcc60Min` data). |

        | **HFM** | High-Frequency METAR stations providing more frequent updates. |

        | **AG** | Agricultural or farm-based stations (including some DAVIS non-agricultural units). |

        | **RWIS** | Road Weather Information Systems — roadside sensors for monitoring road conditions, often operated by local or state agencies. |

        | **SHIP** | Observations collected aboard vessels. |

        | **BUOY&#42;* | Observations from floating buoys. |

        | **Hydro** | Hydrological stations (e.g., river or water-level monitoring). |

        | **Others**        |Stations that don’t fall into the above obs types.                                                                                  |




        ### Search Methods


        The stations endpoint supports multiple search methods via the `by` parameter. Each method requires different parameters:


        | Search Method | Required Parameters | Optional Parameters | Description |

        |---------------|---------------------|---------------------|-------------|

        | `by=stationCodes` | `stationCodes` | `obsTypes`, `archiveCounts` | Search for specific stations by their station codes (up to 100). |

        | `by=radius` | `lat`, `lon` | `radius`, `obsTypes`, `showBest` | Find stations within a radius (km) of a geographic point. Default radius: 25km, max: 100km. |

        | `by=boundingBox` | `minLat`, `maxLat`, `minLon`, `maxLon` | `obsTypes`, `showBest` | Find stations within a rectangular geographic area. |

        | `by=tags` | `tags` | `obsTypes` | Search stations by metadata tags (e.g., ICAO, WMO, IATA, GHCND, name). |


        <details>

        <summary><strong>Deep Dive to Search Methods</strong></summary>


        ### Use Cases


        - **Discover nearby stations** → `by=radius` with `lat`, `lon`, and `radius`

        - **Get all stations in a region** → `by=boundingBox` with geographic boundaries

        - **Retrieve known stations directly** → `by=stationCodes` with specific codes

        - **Search by identifiers** → `by=tags` using `icao`, `wmo`, `iata`, `ghcnd`, or `name` tags


        ### Understanding `showBest`


        When using `by=radius` or `by=boundingBox`, you can add `showBest=true` to optimize results.


        **What showBest Does:**

        - Prioritizes stations with the most complete parameter coverage

        - Favors stations with recent observations

        - Prefers official networks (METAR, SYNOP) over citizen stations

        - Reduces redundant stations in dense areas


        **Example:**

        ```

        GET https://obs.api.dtn.com/v2/observations/stations?by=radius&lat=51.5074&lon=-0.1278&radius=50&showBest=true

        ```


        ### Searching by Tags


        Tags allow you to find stations using standard identifiers or names.


        **Supported Tag Types:**


        | Tag Type | Format | Example | Description |

        |----------|--------|---------|-------------|

        | ICAO | `icao:CODE` | `icao:EGLL` | International Civil Aviation Organization code (airports) |

        | WMO | `wmo:CODE` | `wmo:03772` | World Meteorological Organization code |

        | GHCND | `ghcnd:CODE` | `ghcnd:USW00094728` | Global Historical Climatology Network Daily |

        | IATA | `iata:CODE` | `iata:LHR` | International Air Transport Association code (airports) |

        | Name | `name:TEXT` | `name:Heathrow` | Station name (partial match supported) |


        **Example Requests:**


        **Find by ICAO code:**

        ```

        GET https://obs.api.dtn.com/v2/observations/stations?by=tags&tags={"icao": "EGLL"}

        ```


        **Find by WMO code:**

        ```

        GET https://obs.api.dtn.com/v2/observations/stations?by=tags&tags={"wmo": "3240"}

        ```


        **Find by IATA code:**

        ```

        GET https://obs.api.dtn.com/v2/observations/stations?by=tags&tags={"iata": "LHR"}

        ```


        **Find by station name:**

        ```

        GET https://obs.api.dtn.com/v2/observations/stations?by=tags&tags={"name": "London"}

        ```

        Returns all stations with London in their name.


        **Wildcard search (searches across all tag types):**

        ```

        GET https://obs.api.dtn.com/v2/observations/stations?by=tags&tags=3240

        ```

        Searches for "3240" in all tag fields (WMO, ICAO, IATA, GHCND, name).


        **Multiple values for same tag type:**

        ```

        GET https://obs.api.dtn.com/v2/observations/stations?by=tags&tags={"icao": ["KLXY", "KDHT"]}

        ```

        Returns stations matching either ICAO code.


        ### Usage Notes


        - You can request up to 100 stations per call.

        - The `archiveCounts` parameter is only valid when requesting metadata for a single station.

        - Use the `/parameters` endpoint to discover available parameters for each observation type.

        - This endpoint returns data in GeoJSON FeatureCollection format for easy spatial processing.


        ### Example Requests


        **Search by Station Codes:**

        ```

        GET https://obs.api.dtn.com/v2/observations/stations?by=stationCodes&stationCodes=CPTR3,WXYZ1

        ```


        **Search by Radius:**

        ```

        GET https://obs.api.dtn.com/v2/observations/stations?by=radius&lat=44.55194&lon=-70.544170&radius=10

        ```


        **Search by Bounding Box:**

        ```

        GET https://obs.api.dtn.com/v2/observations/stations?by=boundingBox&minLat=50.85&maxLat=54.85&minLon=-1.85&maxLon=0.85

        ```


        </details>'
      operationId: get_stations_v2_observations_stations_get
      parameters:
      - description: Get stations by `radius`|`boundingBox`|`stationCodes`|`tags`
        required: true
        schema:
          title: By
          pattern: (^radius$|^boundingBox$|^stationCodes$|^tags$)
          type: string
          description: Get stations by `radius`|`boundingBox`|`stationCodes`|`tags`
        name: by
        in: query
      - description: Comma-separated list of up to 100 DTN station codes, e.g. `YNQXX,CPTR3,KNYC1`. Supports retrieving metadata for multiple stations at once.
        required: false
        schema:
          title: Stationcodes
          type: string
          description: Comma-separated list of up to 100 DTN station codes, e.g. `YNQXX,CPTR3,KNYC1`. Supports retrieving metadata for multiple stations (maximum 100). **Quota Usage:** Quota is calculated per returned station, not per request.
        name: stationCodes
        in: query
      - description: 'Latitude for radial search in decimal degrees, e.g. `54.85`. Valid range: -90 to 90.'
        required: false
        schema:
          title: Lat
          type: number
          minimum: -90
          maximum: 90
          description: 'Latitude for radial search in decimal degrees, e.g. `54.85`. Valid range: -90 to 90.'
        name: lat
        in: query
      - description: 'Longitude for radial search in decimal degrees, e.g. `-0.50`. Valid range: -180 to 180.'
        required: false
        schema:
          title: Lon
          type: number
          minimum: -180
          maximum: 180
          description: 'Longitude for radial search in decimal degrees, e.g. `-0.50`. Valid range: -180 to 180.'
        name: lon
        in: query
      - description: Radius for radial search in kilometres. If not set, default is `25`.
        required: false
        schema:
          title: Radius
          maximum: 100
          minimum: 0
          type: number
          description: Radius for radial search in kilometres. If not set, default is `25`.
          default: 25
        name: radius
        in: query
      - description: 'Minimum latitude for boundingBox search in decimal degrees, e.g. `50.85`. Valid range: -90 to 90.'
        required: false
        schema:
          title: Minlat
          type: number
          minimum: -90
          maximum: 90
          description: 'Minimum latitude for boundingBox search in decimal degrees, e.g. `50.85`. Valid range: -90 to 90.'
        name: minLat
        in: query
      - description: Maximum latitude for boundingBox search in decimal degrees, e.g. `54.85`
        required: false
        schema:
          title: Maxlat
          type: number
          minimum: -90
          maximum: 90
          description: Maximum latitude for boundingBox search in decimal degrees, e.g. `54.85`
        name: maxLat
        in: query
      - description: Minimum longitude for boundingBox search in decimal degrees, e.g. `-1.85`
        required: false
        schema:
          title: Minlon
          type: number
          minimum: -180
          maximum: 180
          description: Minimum longitude for boundingBox search in decimal degrees, e.g. `-1.85`
        name: minLon
        in: query
      - description: Maximum longitude for boundingBox search in decimal degrees, e.g. `0.85`
        required: false
        schema:
          title: Maxlon
          type: number
          minimum: -180
          maximum: 180
          description: Maximum longitude for boundingBox search in decimal degrees, e.g. `0.85`
        name: maxLon
        in: query
      - description: Comma-separated list of obsTypes, e.g. `METAR,SYNOP,RWIS,AG`. If not set, default are `METAR,SYNOP`.
        required: false
        schema:
          title: Obstypes
          type: string
          description: Comma-separated list of obsTypes, e.g. `METAR,SYNOP,RWIS,AG`. If not set, default are `METAR,SYNOP`.
        name: obsTypes
        in: query
      - description: Set to `True` to include station tags (such as name and management ID) in the response. When set to `True`, each feature in the response will include a `tags` object containing station metadata. Default is `False` to maintain backward compatibility.
        required: false
        schema:
          title: ShowTags
          type: boolean
          description: Set to `True` to include station tags (such as name and management ID) in the response. When set to `True`, each feature in the response will include a `tags` object containing station metadata. Default is `False` to maintain backward compatibility.
          default: false
        name: showTags
        in: query
      - description: Set to `True` to rank stations by how representative they are of the entered location. This accounts for elevation differences (measured in meters) between stations.
        required: false
        schema:
          title: Showbest
          type: boolean
          description: Set to `True` to rank stations by how representative they are of the entered location. This accounts for elevation differences (measured in meters) between stations.
          default: false
        name: showBest
        in: query
      - description: 'URL encoded json string or a free hand string for wild card search. For multiple tags, they are filtered individually (OR), e.g. `{"icao": "KJFK", "wmo": "3240"}` means you''re searching for stations with the ICAO code KJFK **OR** WMO code 3240. For wild card search, results will show what matches your entry.'
        required: false
        schema:
          title: Tags
          type: string
          description: 'URL encoded json string or a free hand string for wild card search. For multiple tags, they are filtered individually (OR), e.g. `{"icao": "KJFK", "wmo": "3240"}` means you''re searching for stations with the ICAO code KJFK **OR** WMO code 3240. For wild card search, results will show what matches your entry.'
        name: tags
        in: query
      - description: Set to `True` to only return stations where data is available older than 1 month.
        required: false
        schema:
          title: Isarchived
          type: boolean
          description: Set to `True` to only return stations where data is available older than 1 month.
        name: isArchived
        in: query
      - description: Set to `True` to view how many historical observations are available per parameter, month, and year for a single stationCode. **Restriction:** When `archiveCounts=True`, you must provide only one stationCode. Multiple stations are not supported with this parameter.
        required: false
        schema:
          title: Archivecounts
          type: boolean
          description: Set to `True` to view how many historical observations are available per parameter, month, and year for a single stationCode. **Restriction:** When `archiveCounts=True`, you must provide only one stationCode.
          default: false
        name: archiveCounts
        in: query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StnDataRespModel'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '504':
          description: Gateway Timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayTimeoutError'
      security:
      - clientCredentials: []
