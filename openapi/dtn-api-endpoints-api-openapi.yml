  /v2/observations/parameters:
    get:
      tags:
      - API Endpoints
      summary: Parameters
      description: "Use this endpoint to retrieve a complete list of supported observation parameters, including their descriptions, units, and availability across networks. This is your authoritative source of truth for which parameters can be queried from `/observations` and `/stations`.\n\n### Purpose\n\nEach parameter represents a specific type of meteorological or environmental observation — such as temperature, precipitation, humidity, radiation, or wind. Parameters define what data can be retrieved for a given station or time range.\n\n### Access Scopes\n\nYour account scope determines which parameters you can query:\n\n| Feature | Core Scope | Plus Scope |\n|---------|------------|------------|\n| **Available Parameters** | Limited to parameters marked with \"Y\" in the Core column | Access to all parameters (Core and Non-Core) |\n| **Total Parameters** | ~40 core parameters | 150+ parameters including specialized measurements |\n| **Use Cases** | General weather monitoring, basic applications | Professional applications, specialized industries (agriculture, road weather, marine) |\n\n> **Note:** Parameters not available in your scope will be ignored in `/observations` requests without returning an error.\n\n### Getting Full Parameter Details\n\n**For complete, up-to-date parameter information, call the API endpoint directly:**\n\n```\nGET https://obs.api.dtn.com/v2/observations/parameters\n```\n\nThe API response includes detailed descriptions, units, gap-filling support, and scope availability for each parameter. The table below provides a quick reference, but the API endpoint is the authoritative source.\n\n**Example API Request:**\n```\nGET https://obs.api.dtn.com/v2/observations/parameters?names=airTemp,precipAcc60Min,windSpeed\n```\n\n### Parameter Catalog\n\nThe table below groups related parameters together for easy discovery. Each base parameter may have multiple time-aggregated or variant forms listed in the \"Related Parameters\" column.\n\n**Column Definitions:**\n\n- **Base Parameter:** The primary parameter name (instantaneous or default measurement).\n- **Description:** Brief description of what the parameter measures\n- **Metric Unit:** Unit when `units=si-std` (default)\n- **Imperial Unit:** Unit when `units=us-std`\n- **Related Parameters:** Time-aggregated or variant parameters (full names for API requests)\n- **Gapfillable:** Indicates if the parameter supports gap-filling with model data\n  - `Y` = Supports gap-filling with `interval=1h`\n  - `Y*` = Supports gap-filling only with `interval=24h` (daily aggregations)\n- **Measurement Type:** Indicates how the data was obtained or derived\n  - `SRC` = Source (Direct): Raw measurements directly from sensors or instruments\n  - `AGG` = Aggregation: Data derived from statistical operations on source measurements (e.g., hourly averages, daily maximums)\n  - `CAL` = Calculated (Derived): Values computed using formulas or algorithms from other measurements (e.g., heat index, wind chill)\n  - `INTP` = Interpolation (15-minute interval aggregated using hourly values)\n  - Combined types (e.g., `SRC/AGG`, `SRC/CAL`, `SRC/INTP`) indicate the parameter can be obtained through multiple methods\n- **Core:** `Y` indicates the parameter is available to Core Scope accounts\n\n**Understanding Measurement Types:**\n\n- **SRC** Source (Direct): Raw measurements directly from sensors or instruments\n- **AGG** Aggregation: Data derived from statistical operations on source measurements (e.g., hourly averages, daily maximums)\n- **CAL** Calculated (Derived): Values computed using formulas or algorithms from other measurements (e.g., heat index, wind chill)\n- **INTP** Interpolation (15-minute interval aggregated using hourly values)\n- Combined types (e.g., `SRC/AGG`, `SRC/CAL`) indicate the parameter can be obtained through multiple methods\n\n**Gap-Filling Requirements:**\n- Requires gap-filling scope enabled on your account\n- Available from January 1, 2013 onwards\n- See the `/observations` endpoint documentation for details\n\n---\n\n### Temperature Parameters\n\n| Base Parameter | Description | Metric Unit | Imperial Unit | Related Parameters | Gapfillable | Measurement Type | Core |\n|----------------|-------------|-------------|---------------|-------------------|-------------|------|------|\n| airTemp | Air temperature 2m above surface | C | F | airTemp<br>airTemp15Min<br>airTempMax1Hour<br>airTempMax6Hour<br>airTempMax12Hour<br>airTempMax24Hour<br>airTempMin1Hour<br>airTempMin6Hour<br>airTempMin12Hour<br>airTempMin24Hour<br>airTempAvg24Hour<br>airTempAvg<br>airTempMax<br>airTempMin | Y<br>Y<br>Y<br>-<br>-<br>Y&#42;<br>Y<br>-<br>-<br>Y&#42;<br>Y&#42;<br>-<br>-<br>-<br> |SRC<br>INTP<br>SRC/AGG<br>SRC<br>SRC<br>SRC/AGG<br>SRC/AGG<br>SRC<br>SRC<br>SRC/AGG<br>SRC/AGG<br>SRC<br>SRC<br>SRC| Y<br>Y<br>Y<br>Y<br>Y<br>Y<br>Y<br>Y<br>Y<br>Y<br>Y<br>-<br>-<br>-<br> |\n| airTemp5cm | Temperature at 5cm height | C | F | airTemp5cm<br>airTemp5cm15Min<br>airTemp5cmMax1Hour<br>airTemp5cmMax12Hour<br>airTemp5cmMax24Hour<br>airTemp5cmMin1Hour<br>airTemp5cmMin12Hour<br>airTemp5cmMin24Hour<br>airTemp5cmAvg24Hour<br>airTempMax5cm<br>airTempMin5cm | Y<br>Y<br>Y<br>Y<br>-<br>Y&#42;<br>Y<br>-<br>Y&#42;<br>Y&#42;<br>-<br>-<br> |SRC<br>INTP<br>SRC/AGG<br>SRC<br>SRC/AGG<br>SRC/AGG<br>SRC<br>SRC/AGG<br>SRC/AGG<br>SRC<br>SRC| Y<br>Y<br>Y<br>Y<br>Y<br>Y<br>Y<br>Y<br>Y<br>-<br>-<br> |\n| dewPoint | Dew point temperature 2m above surface | C | F | dewPoint<br>dewPoint15Min<br>dewPointMax<br>dewPointMin | Y<br>Y<br>-<br>-<br> |SRC/AGG<br>INTP<br>SRC<br>SRC| Y<br>Y<br>-<br>-<br> |\n| feelsLikeTemp | Human perceived temperature | C | F | feelsLikeTemp<br>feelsLikeTemp15Min<br>feelsLikeTempAvg24Hour<br>feelsLikeTempMax1Hour<br>feelsLikeTempMax24Hour<br>feelsLikeTempMin1Hour<br>feelsLikeTempMin24Hour | Y<br>Y<br>Y&#42;<br>Y<br>Y&#42;<br>Y<br>Y&#42; |SRC/CAL<br>INTP<br>SRC/AGG<br>AGG<br>SRC/AGG<br>AGG<br>SRC/AGG| Y<br>Y<br>-<br>-<br>-<br>-<br>- |\n| heatIndex | Apparent temperature (temp + humidity) | C | F | heatIndex<br>heatIndexAvg24Hour<br>heatIndexMax1Hour<br>heatIndexMax24Hour<br>heatIndexMin1Hour<br>heatIndexMin24Hour | Y<br>Y&#42;<br>Y<br>Y&#42;<br>Y<br>Y&#42; |SRC/CAL<br>SRC/AGG<br>AGG<br>SRC/AGG<br>AGG<br>SRC/AGG| -<br>-<br>-<br>-<br>-<br>- |\n| windChill | Perceived temperature (temp + wind) | C | F | windChill<br>windChillAvg24Hour<br>windChillMax1Hour<br>windChillMax24Hour<br>windChillMin1Hour<br>windChillMin24Hour | Y<br>Y&#42;<br>Y<br>Y&#42;<br>Y<br>Y&#42; |SRC/CAL<br>SRC/AGG<br>AGG<br>SRC/AGG<br>AGG<br>SRC/AGG| -<br>-<br>-<br>-<br>-<br>- |\n| wetBulb | Water-soaked thermometer temperature | C | F | wetBulb | - | SRC/CAL | - |\n| wbgt | Wet Bulb Globe Temperature (heat stress) | C | F | wbgt | Y |SRC/CAL| - |\n| freezingTemp | Water freezing threshold temperature | C | F | freezingTemp<br>freezingTemp2<br>freezingTemp3<br>freezingTemp4<br>freezingTemp5 | -<br>-<br>-<br>-<br>- | SRC<br>SRC<br>SRC<br>SRC<br>SRC | -<br>-<br>-<br>-<br>- |\n\n### Precipitation Parameters\n\n| Base Parameter | Description | Metric Unit | Imperial Unit | Related Parameters | Gapfillable | Measurement Type | Core |\n|----------------|----------------|-------------|-------------|---------------|-------------------|-------------|------|\n| precipAcc | Liquid precipitation (rain) | mm | in | precipAcc10Min<br>precipAcc15Min<br>precipAcc60Min<br>precipAcc3Hour<br>precipAcc6Hour<br>precipAcc12Hour<br>precipAcc24Hour | -<br>Y<br>Y<br>Y<br>Y<br>Y<br>Y&#42;|SRC<br>SRC/INTP<br>SRC/AGG<br>SRC<br>SRC<br>SRC<br>SRC/AGG | Y<br>Y<br>Y<br>Y<br>Y<br>Y<br>Y | \n| precipDuration | Duration of precipitation event | minutes | minutes | precipDuration | - | SRC | - |\n| precipPresence | Indicates if precipitation is present | dimensionless | dimensionless | precipPresence | - | SRC | - |\n| precipRate | Precipitation rate/intensity | mm/hr | in/hr | precipRate | - |  SRC |- |\n| precipType | Type of precipitation | dimensionless | dimensionless | precipType | - | SRC |- |\n| precipStartTime | Precipitation event start time | n/a | n/a | precipStartTime | - |  SRC |- |\n| precipEndTime | Precipitation event end time | n/a | n/a | precipEndTime | - |  SRC |- |\n| precipIntensity | Rate of precipitation falling | n/a | n/a | precipIntensity | - |  SRC |- |\n| snowDepth | Accumulated snow thickness | mm | in | snowDepth | - |  SRC |- |\n| freshSnowDepth | Newly added snow | mm | in | freshSnowDepth | Y |  SRC |- |\n| adjacentSnowDepth | Undisturbed snow depth | mm | in | adjacentSnowDepth | - |  SRC |- |\n\n### Wind Parameters\n\n| Base Parameter | Description | Metric Unit | Imperial Unit | Related Parameters | Gapfillable | Measurement Type | Core |\n|----------------|----------------|-------------|-------------|---------------|-------------------|-------------|------|\n| windSpeed | Wind speed 10m above surface | m/s | mph | windSpeed<br>windSpeed15Min<br>windSpeedMax60Min<br>windSpeedMax24Hour<br>windSpeedAvg24Hour | Y<br>Y<br>Y<br>Y&#42;<br>Y&#42; |SRC<br>INTP<br>SRC/AGG<br>SRC/AGG<br>SRC/AGG| Y<br>Y<br><br>Y<br>Y |\n| windSpeed2m | Wind speed 2m above surface | m/s | mph | windSpeed2m<br>windSpeed2m15Min<br>windSpeed2mMax60Min | Y<br>Y<br>Y | SRC<br>INTP<br>SRC/AGG|Y<br>- |\n| windDirection | Wind direction (10m height) | degrees | degrees | windDirection<br>windDirection15Min<br>windDirectionAvg24Hour | Y<br>Y<br>Y&#42; | SRC<br>INTP<br>SRC/AGG |Y<br>Y<br>Y |\n| windDirection2m | Wind direction (2m height) | degrees | degrees | windDirection2m | - |SRC| Y |\n| windGust | Wind gust speed 10m above surface | m/s | mph | windGust<br>windGust15Min<br>windGust60Min<br>windGust3Hour<br>windGust6Hour<br>windGustMax24Hour<br>windGustDirectionMax | Y<br>Y<br>Y<br>Y<br>Y<br>Y&#42;<br>-<br> |SRC<br>INTP<br>SRC/AGG<br>SRC<br>SRC<br>SRC/AGG<br>SRC| Y<br>Y<br>Y<br>Y<br>Y<br>Y<br>-<br> |\n| windGust2m | Wind gust speed 2m above surface | m/s | mph | windGust2m | Y | SRC |Y |\n\n### Pressure Parameters\n\n| Base Parameter | Description | Metric Unit | Imperial Unit | Related Parameters | Gapfillable | Measurement Type | Core |\n|----------------|----------------|-------------|-------------|---------------|-------------------|-------------|------|\n| stationPressure | Air pressure at station elevation | hPa | mb | stationPressure<br>stationPressure15Min | Y<br>Y | SRC/CAL<br>INTP| Y<br>Y |\n| mslPressure | Air pressure at mean sea level | hPa | mb | mslPressure | Y | SRC/CAL |- |\n| altimeter | Pressure for aircraft calibration | hPa | mb | altimeter | - | SRC |- |\n| pressureChange3Hour | Pressure change over 3 hours | hPa | mb | pressureChange3Hour<br>pressureChange6Hour<br>pressureChange12Hour<br>pressureChange24Hour | -<br>-<br>-<br>- |SRC<br>SRC<br>SRC<br>SRC |-<br>-<br>-<br>- |\n| pressureTendency | The character and amount of atmospheric pressure change during a specified period of time | dimentionless | dimentionless | pressureTendency | - | SRC/CAL| - |\n| pressureTendencyInCode | Pressure tendency (coded) | dimentionless | dimentionless | pressureTendencyInCode | - | SRC| - |\n\n### Humidity & Moisture Parameters\n\n| Base Parameter | Description | Metric Unit | Imperial Unit | Related Parameters | Gapfillable | Measurement Type | Core |\n|----------------|----------------|-------------|-------------|---------------|-------------------|-------------|------|\n| relativeHumidity | Ratio of actual to max water vapor | % | % | relativeHumidity<br>relativeHUmidity15Min | Y<br>Y | SRC/CAL<br>INTP |Y<br>Y |\n| soilMoisture | Soil moisture level | % | % | soilMoisture | - | SRC |- |\n| leafWetness | Surface moisture on crop | index | index | leafWetness | - |SRC |- |\n| evapotranspiration | Water transfer to atmosphere | mm | in | evapotranspiration | Y | SRC |- |\n| fuelMoisture | Water in vegetation (fire weather) | % | % | fuelMoisture | - | SRC |- |\n\n### Radiation & Solar Parameters\n\n| Base Parameter | Description | Metric Unit | Imperial Unit | Related Parameters | Gapfillable | Measurement Type | Core |\n|----------------|----------------|-------------|-------------|---------------|-------------------|-------------|------|\n| shortWaveRadiation | Instantaneous solar radiation (GHI) | W/m² | W/m² | shortWaveRadiation<br>shortWaveRadiation15Min | Y<br>Y | SRC<br>INTP |Y<br>Y |\n| globalRadiation | Solar radiation | j/cm² | j/cm² | globalRadiation10Min<br>globalRadiation15Min<br>globalRadiation60Min<br>globalRadiation24Hour | -<br>-<br>Y<br>Y&#42; | SRC<br>INTP<br>SRC/AGG<br>SRC/AGG|-<br>Y<br>Y<br>Y |\n| sunshine | Duration of sunshine | min | min | sunshine10Min<br>sunshine15Min<br>sunshine60Min<br>sunshine24Hour | -<br>Y<br>Y<br>Y&#42; |SRC<br>INTP<br>SRC/AGG<br>SRC/AGG |Y<br>Y<br>Y<br>Y |\n| sunrise | UTC time of sunrise | UTC | UTC | sunrise | -|SRC/CAL | Y |\n| sunset | UTC time of sunset | UTC | UTC | sunset | -|SRC/CAL| Y |\n\n### Visibility & Cloud Parameters\n\n| Base Parameter | Description | Metric Unit | Imperial Unit | Related Parameters | Gapfillable | Measurement Type | Core |\n|----------------|-------------|-------------|-------------|---------------|-------------------|-------------|------|\n| visibility | Horizontal visibility | km | mi | visibility<br>visibility15Min | Y<br>Y |SRC<br>INTP| Y<br>Y |\n| cloudCover | Sky covered by cloud | % | % | cloudCover<br>cloudCover15Min | Y<br>Y |SRC<br>INTP |Y<br>Y |\n| cloudBase | Cloud base altitude | m | ft | cloudBase | Y | SRC|- |\n| metarSky | METAR cloud code (aviation) | dimensionless | dimensionless | metarSky | - | SRC|- |\n\n### Road Weather (RWIS) Parameters\n\n| Base Parameter | Description | Metric Unit | Imperial Unit | Related Parameters | Gapfillable | Measurement Type | Core |\n|----------------|-------------|-------------|-------------|---------------|-------------------|-------------|------|\n| surfaceTemp | Road/pavement surface temperature | C | F | surfaceTemp<br>surfaceTemp2<br>surfaceTemp3<br>surfaceTemp4<br>surfaceTemp5<br>surfaceTemp6<br>surfaceTemp7<br>surfaceTemp8<br>surfaceTemp9<br>surfaceTemp10<br>surfaceTemp11<br>surfaceTemp12<br>surfaceTemp13<br>surfaceTemp14<br>surfaceTemp15<br>surfaceTemp16<br>surfaceTemp17<br>surfaceTemp18<br>surfaceTemp19<br>surfaceTemp20<br>surfaceTemp21<br>surfaceTemp22<br>surfaceTemp23<br>surfaceTemp24 | -<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>- | SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC |-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>- |\n| surfaceCondition | Road/bridge surface state | dimensionless | dimensionless | surfaceCondition<br>surfaceCondition1 | - <br> -| SRC<br>SRC | - <br> - |\n| surfaceConductivity | Road surface electrical conductivity | mhos/cm | mhos/cm | surfaceConductivity<br>surfaceConductivity2<br>surfaceConductivity3<br>surfaceConductivity4<br>surfaceConductivity5<br>surfaceConductivity6<br>surfaceConductivity7<br>surfaceConductivity8<br>surfaceConductivity9<br>surfaceConductivity10<br>surfaceConductivity11<br>surfaceConductivity12 | -<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>- |SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC |-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>- |\n| bridgeTemp | Bridge surface temperature | C | F | bridgeTemp<br>bridgeTemp2<br>bridgeTemp3<br>bridgeTemp4<br>bridgeTemp5<br>bridgeTemp6<br>bridgeTemp7<br>bridgeTemp8<br>bridgeTemp9<br>bridgeTemp10 | -<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>- |SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC |-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>- |\n| bridgeConductivity | Bridge surface conductivity | mhos/cm | mhos/cm | bridgeConductivity<br>bridgeConductivity2<br>bridgeConductivity3<br>bridgeConductivity4<br>bridgeConductivity5<br>bridgeConductivity6 | -<br>-<br>-<br>-<br>-<br>- | SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC |-<br>-<br>-<br>-<br>-<br>-  |\n| cycleTemp | Cycle surface temperature | C | F | cycleTemp<br>cycleTemp2<br>cycleTemp3<br>cycleTemp4<br>cycleTemp5<br>cycleTemp6 | -<br>-<br>-<br>-<br>-<br>- | SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC | -<br>-<br>-<br>-<br>-<br>- |\n| cycleConductivity | Cycle surface conductivity | mhos/cm | mhos/cm | cycleConductivity<br>cycleConductivity2<br>cycleConductivity3<br>cycleConductivity4<br>cycleConductivity5<br>cycleConductivity6 | -<br>-<br>-<br>-<br>-<br>- | SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC | -<br>-<br>-<br>-<br>-<br>- |\n| friction | Road/tire grip | mu | mu | friction | - | SRC | - |\n| icePercent | Ice proportion in surface moisture | % | % | icePercent | - | SRC | - |\n| iceThickness | Solid ice depth | mm | in | iceThickness | - | SRC | - |\n| iceOrWaterDepth | Ice or standing water depth | mm | in | iceOrWaterDepth | - | SRC |- |\n| waterThickness | Water film depth on surface | mm | in | waterThickness | - | SRC |- |\n| waterLevel | Water level or accumulated depth | mm | in | waterLevel | - | SRC |- |\n| chemicalPercent | Chemical concentration on road | % | % | chemicalPercent | - | SRC | - |\n| chemicalFactor | De-icing chemical effectiveness | n/a | n/a | chemicalFactor | - | SRC | - |\n\n### Soil & Subsurface Parameters\n\n| Base Parameter | Description | Metric Unit | Imperial Unit | Related Parameters | Gapfillable | Measurement Type | Core |\n|----------------|-------------|-------------|---------------|---------------|-------------------|-------------|------|\n| soilTemp | Soil temperature at depth | C | F | soilTemp100cm | - | SRC | - |\n| subsurfaceTemp | Temperature below surface | C | F | subsurfaceTemp<br>subsurfaceTemp2<br>subsurfaceTemp3<br>subsurfaceTemp4<br>subsurfaceTemp5<br>subsurfaceTemp6<br>subsurfaceTemp7<br>subsurfaceTemp8<br>subsurfaceTemp9<br>subsurfaceTemp10<br>subsurfaceTemp11<br>subsurfaceTemp12<br>subsurfaceTemp13<br>subsurfaceTemp14<br>subsurfaceTemp15<br>subsurfaceTemp5cm<br>subsurfaceTemp10cm<br>subsurfaceTemp20cm<br>subsurfaceTemp50cm<br>subsurfaceTemp100cm<br>subsurfaceTemp150cm | -<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>- | SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC<br>SRC | -<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>-<br>- |\n\n### Marine Parameters\n\n| Base Parameter | Description | Metric Unit | Imperial Unit | Related Parameters | Gapfillable | Measurement Type | Core |\n|----------------|-------------|-------------|---------------|---------------|-------------------|-------------|------|\n| seaSurfaceTemp | Seawater temperature at surface | C | F | seaSurfaceTemp | - | SRC |- |\n| seaWaterTemp | Water temperature near ocean surface | C | F | seaWaterTemp | - | SRC | - |\n| seaWaterSalinity | Salt concentration in sea water | g/kg | ppt | seaWaterSalinity | - | SRC | - |\n| significantWaveHeight | Mean height of highest waves | m | ft | significantWaveHeight | - | SRC |- |\n| waveDirection | Direction of ocean/sea waves | degrees | degrees | waveDirection | - | SRC | - |\n| wavePeakPeriod | Period of most energetic waves | sec | sec | wavePeakPeriod | - | SRC | - |\n| eastwardCurrent | Eastward sea current speed | m/s | mph | eastwardCurrent | - | SRC | - |\n| northwardCurrent | Northward sea current speed | m/s | mph | northwardCurrent | - | SRC | - |\n\n### Weather Condition Codes\n\n| Base Parameter | Description | Metric Unit | Imperial Unit | Related Parameters | Gapfillable | Measurement Type | Core |\n|----------------|-------------|-------------|-------------|---------------|-------------------|-------------|------|\n| weatherCode | DTN-specific weather code | dimensionless | dimensionless | weatherCode | Y | CAL | Y |\n| wmoWeatherCode | WMO weather code (table 4677) | dimensionless | dimensionless | wmoWeatherCode<br>wmoWeatherCode15Min | Y<br>Y | SRC/CAL<br>INTP| Y<br>Y |\n| wmoWeatherCode4561 | WMO recent phenomenon (table 4561) | dimensionless | dimensionless | wmoWeatherCode4561 | - | SRC | Y |\n| metarWx | METAR weather description | dimensionless | dimensionless | metarWx | - | SRC | - |\n\n### Degree Days & Specialized Parameters\n\n| Base Parameter | Description | Metric Unit | Imperial Unit | Related Parameters | Gapfillable | Measurement Type | Core |\n|----------------|-------------|-------------|-------------|---------------|-------------------|-------------|------|\n| heatingDegreeUS24Hour | Heating demand (base 65°F) | C | F | heatingDegreeUS24Hour | - | SRC | - |\n| coolingDegreeUS24Hour | Cooling demand (base 65°F) | C | F | coolingDegreeUS24Hour | - | CAL | - |\n| gradtagzahl24Hour | German heating degree day (+2°C) | C | F | gradtagzahl24Hour | - | CAL | - |\n| gradtagzahlBasic24Hour | German heating degree day (base 20°C) | C | F | gradtagzahlBasic24Hour | - | CAL | - |\n\n---\n\n### Code Value Reference Tables\n\nSeveral parameters return coded values rather than numeric measurements. The tables below provide comprehensive lookup references for interpreting these codes.\n\n**Parameters with Code Values:**\n- `metarSky` - METAR/TAF aviation weather abbreviations\n- `pressureTendencyInCode` - Atmospheric pressure change characteristics\n- `surfaceCondition` - Road and pavement surface states (RWIS)\n- `weatherCode` - DTN proprietary weather condition codes with icons\n- `wmoWeatherCode` - WMO present weather observations (Table 4677)\n- `wmoWeatherCode4561` - WMO past weather conditions (Table 020004)\n\n---\n\n<details>\n<summary><strong>metarSky</strong> - METAR/TAF Aviation Weather Abbreviations</summary>\n\nCommon METAR (Meteorological Aerodrome Report) and TAF (Terminal Aerodrome Forecast) abbreviations for sky conditions and weather phenomena used in aviation.\n\n| Code | Category | Description |\n|------|----------|-------------|\n| **SKC** | Sky Condition | Sky clear |\n| **CLR** | Sky Condition | Clear (automated stations) |\n| **FEW** | Sky Condition | Few clouds (1/8 to 2/8 coverage) |\n| **SCT** | Sky Condition | Scattered (3/8 to 4/8 coverage) |\n| **BKN** | Sky Condition | Broken (5/8 to 7/8 coverage) |\n| **OVC** | Sky Condition | Overcast (8/8 coverage) |\n| **VV** | Sky Condition | Vertical visibility (obscured sky) |\n| **CB** | Cloud Type | Cumulonimbus |\n| **TCU** | Cloud Type | Towering cumulus |\n| **ACC** | Cloud Type | Altocumulus castellanus |\n| **ACSL** | Cloud Type | Altocumulus standing lenticular |\n| **CCSL** | Cloud Type | Cirrocumulus standing lenticular |\n| **SCSL** | Cloud Type | Stratocumulus standing lenticular |\n| **-** | Descriptor | Light intensity |\n| **+** | Descriptor | Heavy intensity |\n| **VC** | Descriptor | In the vicinity |\n| **MI** | Descriptor | Shallow |\n| **BC** | Descriptor | Patches |\n| **PR** | Descriptor | Partial |\n| **DR** | Descriptor | Low drifting |\n| **BL** | Descriptor | Blowing |\n| **SH** | Descriptor | Shower(s) |\n| **TS** | Descriptor | Thunderstorm |\n| **FZ** | Descriptor | Freezing |\n| **DZ** | Precipitation | Drizzle |\n| **RA** | Precipitation | Rain |\n| **SN** | Precipitation | Snow |\n| **SG** | Precipitation | Snow grains |\n| **IC** | Precipitation | Ice crystals |\n| **PL** | Precipitation | Ice pellets |\n| **GR** | Precipitation | Hail |\n| **GS** | Precipitation | Small hail/snow pellets |\n| **UP** | Precipitation | Unknown precipitation |\n| **BR** | Obscuration | Mist |\n| **FG** | Obscuration | Fog |\n| **FU** | Obscuration | Smoke |\n| **VA** | Obscuration | Volcanic ash |\n| **DU** | Obscuration | Widespread dust |\n| **SA** | Obscuration | Sand |\n| **HZ** | Obscuration | Haze |\n| **PY&#42;* | Obscuration | Spray |\n| **SQ** | Other | Squalls |\n| **PO** | Other | Dust/sand whirls |\n| **DS** | Other | Duststorm |\n| **SS** | Other | Sandstorm |\n| **FC** | Other | Funnel cloud |\n\n</details>\n\n<details>\n<summary><strong>pressureTendencyInCode</strong> - Atmospheric Pressure Tendency</summary>\n\nWMO code table for element 010063 describing the characteristic of atmospheric pressure change over the past 3 hours.\n\n| Code | Description |\n|------|-------------|\n| 0 | Increasing, then decreasing; pressure same or higher than 3 hours ago |\n| 1 | Increasing, then steady; or increasing, then increasing more slowly |\n| 2 | Increasing (steadily or unsteadily) |\n| 3 | Decreasing or steady, then increasing; or increasing, then increasing more rapidly |\n| 4 | Steady; atmospheric pressure the same as 3 hours ago |\n| 5 | Decreasing, then increasing; pressure same or lower than 3 hours ago |\n| 6 | Decreasing, then steady; or decreasing, then decreasing more slowly |\n| 7 | Decreasing (steadily or unsteadily) |\n| 8 | Steady or increasing, then decreasing; or decreasing, then decreasing more rapidly |\n\n</details>\n\n<details>\n<summary><strong>surfaceCondition</strong> - Road Surface Conditions</summary>\n\nRoadMaster codes for road and pavement surface states from Road Weather Information Systems (RWIS).\n\n| Code | Description |\n|------|-------------|\n| 0 | Short road surface sensor not in operation |\n| 100 | Dry - road surface dry, no ice or snow |\n| 101 | Wet - liquid water on road surface, no ice, no deicing chemical |\n| 106 | Frosty - frost on the road surface |\n| 108 | Icy - ice on road surface, not formed as frost, no snow |\n| 111 | Snowy - snow on the road surface |\n| 121 | Wet and chemical - liquid water containing deicing chemical, no ice |\n| 123 | Moist and chemical - road surface moist with de-icing chemical, no ice, no snow |\n| 124 | Moist - moisture in road surface, but only a little, no ice, no deicing chemical |\n\n</details>\n\n<details>\n<summary><strong>weatherCode</strong> - DTN Weather Condition Codes</summary>\n\nDTN proprietary weather codes with corresponding icon filenames. Icons available at: `https://static-assets.dtn.com/icons/weather-conditions/v1/{filename}`\n\n**Note:** For codes 1-4, append `_night` suffix for nighttime icons (e.g., `clear_skies_night.svg`).\n\n| Code | Description | Icon Filenames |\n|------|-------------|----------------|\n| 1 | Clear skies | clear_skies.svg, clear_skies_night.svg |\n| 2 | Fair | fair.svg, fair_night.svg |\n| 3 | Partly cloudy | partly_cloudy.svg, partly_cloudy_night.svg |\n| 4 | Mostly cloudy | mostly_cloudy.svg, mostly_cloudy_night.svg |\n| 5 | Cloudy | cloudy.svg |\n| 6 | Mist | mist.svg |\n| 7 | Fog | fog.svg |\n| 8 | Drizzle | drizzle.svg |\n| 9 | Rain | rain.svg |\n| 10 | Heavy rain | heavy_rain.svg |\n| 11 | Freezing drizzle | freezing_drizzle.svg |\n| 12 | Freezing rain | freezing_rain.svg |\n| 13 | Freezing heavy rain | freezing_heavy_rain.svg |\n| 14 | Rain and snow | rain_and_snow.svg |\n| 15 | Heavy rain and snow | heavy_rain_and_snow.svg |\n| 16 | Snow | snow.svg |\n| 17 | Heavy snow | heavy_snow.svg |\n| 18 | Blizzard | blizzard.svg |\n| 19 | Ice pellets | ice_pellets.svg |\n| 20 | Rain showers | rain_showers.svg |\n| 21 | Heavy rain showers | heavy_rain_showers.svg |\n| 22 | Freezing rain showers | freezing_rain_showers.svg |\n| 23 | Heavy freezing rain showers | heavy_freezing_rain_showers.svg |\n| 24 | Rain and snow showers | rain_and_snow_showers.svg |\n| 25 | Heavy rain and snow showers | heavy_rain_and_snow_showers.svg |\n| 26 | Snow showers | snow_showers.svg |\n| 27 | Heavy snow showers | heavy_snow_showers.svg |\n| 28 | Hail showers | hail_showers.svg |\n| 29 | Heavy hail showers | heavy_hail_showers.svg |\n| 30 | Thunderstorms | thunderstorms.svg |\n| 31 | Severe thunderstorms | heavy_thunderstorms.svg |\n| 32 | Windy | windy.svg |\n\n</details>\n\n<details>\n<summary><strong>wmoWeatherCode</strong> - WMO Present Weather Observations</summary>\n\nWorld Meteorological Organization present weather codes (Table 4677) reported from manned weather stations.\n\n**Codes 00-19: No precipitation, fog, or thunderstorm at time of observation**\n\n| Code | Description |\n|------|-------------|\n| 00 | Cloud development not observed or not observable |\n| 01 | Clouds generally dissolving or becoming less developed |\n| 02 | State of sky on the whole unchanged |\n| 03 | Clouds generally forming or developing |\n| 04 | Visibility reduced by smoke |\n| 05 | Haze |\n| 06 | Widespread dust in suspension in the air |\n| 07 | Dust or sand raised by wind at or near the station |\n| 08 | Well developed dust whirl(s) or sand whirl(s) |\n| 09 | Duststorm or sandstorm within sight |\n| 10 | Mist |\n| 11 | Patches of shallow fog or ice fog |\n| 12 | More or less continuous shallow fog or ice fog |\n| 13 | Lightning visible, no thunder heard |\n| 14 | Precipitation within sight, not reaching the ground |\n| 15 | Precipitation within sight, reaching ground, distant (>5 km) |\n| 16 | Precipitation within sight, reaching ground, near but not at station |\n| 17 | Thunderstorm, but no precipitation at time of observation |\n| 18 | Squalls at or within sight |\n| 19 | Funnel cloud(s) (tornado or waterspout) |\n\n**Codes 20-29: Precipitation, fog, or thunderstorm during preceding hour but not at time of observation**\n\n| Code | Description |\n|------|-------------|\n| 20 | Drizzle (not freezing) or snow grains |\n| 21 | Rain (not freezing) |\n| 22 | Snow |\n| 23 | Rain and snow or ice pellets |\n| 24 | Freezing drizzle or freezing rain |\n| 25 | Shower(s) of rain |\n| 26 | Shower(s) of snow, or of rain and snow |\n| 27 | Shower(s) of hail or rain and hail |\n| 28 | Fog or ice fog |\n| 29 | Thunderstorm (with or without precipitation) |\n\n**Codes 30-39: Duststorm, sandstorm, drifting or blowing snow**\n\n| Code | Description |\n|------|-------------|\n| 30 | Slight/moderate duststorm or sandstorm - decreased during preceding hour |\n| 31 | Slight/moderate duststorm or sandstorm - no appreciable change |\n| 32 | Slight/moderate duststorm or sandstorm - begun or increased |\n| 33 | Severe duststorm or sandstorm - decreased during preceding hour |\n| 34 | Severe duststorm or sandstorm - no appreciable change |\n| 35 | Severe duststorm or sandstorm - begun or increased |\n| 36 | Slight/moderate drifting snow, generally low (below eye level) |\n| 37 | Heavy drifting snow, generally low |\n| 38 | Slight/moderate blowing snow, generally high (above eye level) |\n| 39 | Heavy blowing snow, generally high |\n\n**Codes 40-49: Fog or ice fog at time of observation**\n\n| Code | Description |\n|------|-------------|\n| 40 | Fog at distance, not at station during preceding hour |\n| 41 | Fog in patches |\n| 42 | Fog, sky visible, has become thinner |\n| 43 | Fog, sky invisible, has become thinner |\n| 44 | Fog, sky visible, no appreciable change |\n| 45 | Fog, sky invisible, no appreciable change |\n| 46 | Fog, sky visible, has begun or become thicker |\n| 47 | Fog, sky invisible, has begun or become thicker |\n| 48 | Fog, depositing rime, sky visible |\n| 49 | Fog, depositing rime, sky invisible |\n\n**Codes 50-59: Drizzle**\n\n| Code | Description |\n|------|-------------|\n| 50 | Drizzle, not freezing, intermittent, slight |\n| 51 | Drizzle, not freezing, continuous, slight |\n| 52 | Drizzle, not freezing, intermittent, moderate |\n| 53 | Drizzle, not freezing, continuous, moderate |\n| 54 | Drizzle, not freezing, intermittent, heavy |\n| 55 | Drizzle, not freezing, continuous, heavy |\n| 56 | Drizzle, freezing, slight |\n| 57 | Drizzle, freezing, moderate or heavy |\n| 58 | Drizzle and rain, slight |\n| 59 | Drizzle and rain, moderate or heavy |\n\n**Codes 60-69: Rain**\n\n| Code | Description |\n|------|-------------|\n| 60 | Rain, not freezing, intermittent, slight |\n| 61 | Rain, not freezing, continuous, slight |\n| 62 | Rain, not freezing, intermittent, moderate |\n| 63 | Rain, not freezing, continuous, moderate |\n| 64 | Rain, not freezing, intermittent, heavy |\n| 65 | Rain, not freezing, continuous, heavy |\n| 66 | Rain, freezing, slight |\n| 67 | Rain, freezing, moderate or heavy |\n| 68 | Rain or drizzle and snow, slight |\n| 69 | Rain or drizzle and snow, moderate or heavy |\n\n**Codes 70-79: Solid precipitation not in showers**\n\n| Code | Description |\n|------|-------------|\n| 70 | Intermittent fall of snowflakes, slight |\n| 71 | Continuous fall of snowflakes, slight |\n| 72 | Intermittent fall of snowflakes, moderate |\n| 73 | Continuous fall of snowflakes, moderate |\n| 74 | Intermittent fall of snowflakes, heavy |\n| 75 | Continuous fall of snowflakes, heavy |\n| 76 | Diamond dust (with or without fog) |\n| 77 | Snow grains (with or without fog) |\n| 78 | Isolated star-like snow crystals (with or without fog) |\n| 79 | Ice pellets |\n\n**Codes 80-99: Showery precipitation or precipitation with thunderstorm**\n\n| Code | Description |\n|------|-------------|\n| 80 | Rain shower(s), slight |\n| 81 | Rain shower(s), moderate or heavy |\n| 82 | Rain shower(s), violent |\n| 83 | Shower(s) of rain and snow mixed, slight |\n| 84 | Shower(s) of rain and snow mixed, moderate or heavy |\n| 85 | Snow shower(s), slight |\n| 86 | Snow shower(s), moderate or heavy |\n| 87 | Shower(s) of snow pellets or small hail, slight |\n| 88 | Shower(s) of snow pellets or small hail, moderate or heavy |\n| 89 | Shower(s) of hail, not with thunder, slight |\n| 90 | Shower(s) of hail, not with thunder, moderate or heavy |\n| 91 | Slight rain, thunderstorm during preceding hour |\n| 92 | Moderate or heavy rain, thunderstorm during preceding hour |\n| 93 | Slight snow/rain and snow/hail, thunderstorm during preceding hour |\n| 94 | Moderate or heavy snow/rain and snow/hail, thunderstorm during preceding hour |\n| 95 | Thunderstorm, slight or moderate, with rain/snow at time of observation |\n| 96 | Thunderstorm, slight or moderate, with hail at time of observation |\n| 97 | Thunderstorm, heavy, with rain/snow at time of observation |\n| 98 | Thunderstorm combined with duststorm or sandstorm |\n| 99 | Thunderstorm, heavy, with hail at time of observation |\n\n</details>\n\n<details>\n<summary><strong>wmoWeatherCode4561</strong> - WMO Past Weather Conditions</summary>\n\nWorld Meteorological Organization past weather codes (Table 020004). Past weather is defined as weather occurring in the past 6 hours (at 00, 06, 12, 18 UTC) or past 3 hours (at 03, 09, 15, 21 UTC).\n\n| Code | Description |\n|------|-------------|\n| 0 | Cloud covering half or less of the sky throughout the period |\n| 1 | Cloud covering more than half the sky during part of the period and half or less for the rest |\n| 2 | Cloud covering more than half the sky throughout the period |\n| 3 | Sandstorm, duststorm or blowing snow |\n| 4 | Fog or ice fog or thick haze |\n| 5 | Drizzle |\n| 6 | Rain |\n| 7 | Snow, or rain and snow mixed |\n| 8 | Shower(s) |\n| 9 | Thunderstorm(s) with or without precipitation |\n\n</details>\n\n---\n\n### Notes\n\n- **Related Parameters** column shows all time-aggregated or variant forms of the base parameter\n- Parameters without related variants are shown with a dash (-)\n- For RWIS and subsurface parameters, sensor variants (2-6 or 2-15) represent multiple sensors at different locations\n- For coded parameters, refer to the Code Value Reference Tables above for interpretation\n- Call the `/parameters` API endpoint for complete, detailed descriptions of each parameter"
