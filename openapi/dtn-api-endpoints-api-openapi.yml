      - lang: Javascript + Xhr
        source: "const xhr = new XMLHttpRequest();\nxhr.open('GET', 'https://obs.api.dtn.com/v2/observations/parameters');\nxhr.setRequestHeader('Authorization', 'Bearer YOUR_ACCESS_TOKEN');\n\nxhr.onload = function() {\n    if (xhr.status === 200) {\n        console.log(JSON.parse(xhr.responseText));\n    }\n};\n\nxhr.send();"
      - lang: Node + Native
        source: "const https = require('https');\n\nconst options = {\n    hostname: 'obs.api.dtn.com',\n    path: '/v2/observations/parameters',\n    method: 'GET',\n    headers: {\n        'Authorization': 'Bearer YOUR_ACCESS_TOKEN'\n    }\n};\n\nconst req = https.request(options, (res) => {\n    let data = '';\n    res.on('data', (chunk) => { data += chunk; });\n    res.on('end', () => { console.log(JSON.parse(data)); });\n});\n\nreq.end();"
      - lang: Node + Request
        source: "const request = require('request');\n\nconst options = {\n    url: 'https://obs.api.dtn.com/v2/observations/parameters',\n    headers: {\n        'Authorization': 'Bearer YOUR_ACCESS_TOKEN'\n    }\n};\n\nrequest.get(options, (error, response, body) => {\n    if (!error && response.statusCode === 200) {\n        console.log(JSON.parse(body));\n    }\n});"
      - lang: Objc + Nsurlsession
        source: "NSURL *url = [NSURL URLWithString:@\"https://obs.api.dtn.com/v2/observations/parameters\"];\nNSMutableURLRequest *request = [NSMutableURLRequest requestWithURL:url];\n[request setHTTPMethod:@\"GET\"];\n[request setValue:@\"Bearer YOUR_ACCESS_TOKEN\" forHTTPHeaderField:@\"Authorization\"];\n\nNSURLSession *session = [NSURLSession sharedSession];\nNSURLSessionDataTask *task = [session dataTaskWithRequest:request\n    completionHandler:^(NSData *data, NSURLResponse *response, NSError *error) {\n        if (!error) {\n            NSLog(@\"%@\", [[NSString alloc] initWithData:data encoding:NSUTF8StringEncoding]);\n        }\n    }];\n[task resume];"
