      - lang: Java + Okhttp
        source: "import okhttp3.OkHttpClient;\nimport okhttp3.Request;\nimport okhttp3.Response;\n\npublic class ParametersExample {\n    public static void main(String[] args) throws Exception {\n        OkHttpClient client = new OkHttpClient();\n        \n        String url = \"https://obs.api.dtn.com/v2/observations/parameters\";\n        \n        Request request = new Request.Builder()\n            .url(url)\n            .addHeader(\"Authorization\", \"Bearer YOUR_ACCESS_TOKEN\")\n            .build();\n        \n        try (Response response = client.newCall(request).execute()) {\n            System.out.println(response.body().string());\n        }\n    }\n}"
      - lang: Java + Unirest
        source: "import kong.unirest.Unirest;\nimport kong.unirest.HttpResponse;\n\npublic class ParametersExample {\n    public static void main(String[] args) {\n        HttpResponse<String> response = Unirest.get(\"https://obs.api.dtn.com/v2/observations/parameters\")\n            .header(\"Authorization\", \"Bearer YOUR_ACCESS_TOKEN\")\n            .asString();\n        \n        System.out.println(response.getBody());\n    }\n}"
      - lang: Javascript + Jquery
